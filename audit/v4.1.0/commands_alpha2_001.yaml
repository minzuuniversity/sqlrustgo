# 20261109-alpha-gates-002 —— ALPHA 清单(10 条,原文口径一字不变)在冻结尖端 c06209fd11 的重跑。
# 与 20261107-alpha-gates-001 的差异只有两处口径披露:
#   1) target 指向专用 CARGO_TARGET_DIR(ab1target,软链),排除「共享 target 重建期测量假红」同源三类;
#   2) 两条 124 超时臂(check_alpha_v410 / g1_tpch)timeout 1800→3600 —— 上轮 124 发生在并发 cargo
#      风暴 + target 重建窗口,加长窗口是给判据公平机会,不是放松判据(命令一字不动)。

- id: alpha-gate-check-alpha-v410
  name: "ALPHA 清单门禁(原文):scripts/gate/check_alpha_v410.sh;上轮 124 超时,本轮专用 target + 3600s"
  cmd: bash scripts/gate/check_alpha_v410.sh
  cwd: .
  timeout_sec: 3600

