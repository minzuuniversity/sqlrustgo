# AB campaign 002 — AB-01..AB-10 逐项取证（第二轮；Owner g6 放行 2026-11-12）
# 冻结提交 = audit/v4.1.0/commit.txt（freeze 写入 HEAD）
#
# 与 001 的差异（每一处都对应 001 的一个实测红）：
#
# 1. **AB-07 soak 走监督 wrapper**（scripts/soak/run_soak_with_heartbeat.sh，#5753）：
#    001 的 soak 臂没有心跳、且脚本把 `driver.log` 缺失崩成裸 traceback；
#    本轮 wrapper 负责「真实 pid 心跳 + 闭合校验」，脚本侧对「没加载」fail-closed。
# 2. **新增 AB-07 驱动前置臂**：001 的首跑因驱动缺 pymysql 而**空转了一小时**
#    （q=0/e=0/panics=0 看着像通过）。本轮把「pymysql 可用」做成**独立前置臂**：
#    缺依赖就明确红，不允许 soak 臂在空转状态下被读成绿。
# 3. **AB-09 安全扫描的输出重定向到 /tmp**：001 实测该臂会**覆写已提交的证据文件**
#    （docs/releases/v3.12.0/evidence/v312-59/ 四件，#5577 缺陷类）⇒ 本轮用
#    EVIDENCE_DIR/OUT_FILE 指向临时目录，仓内证据零改动。
# 4. **AB-08 增加 criterion 管道冒烟臂**：001 的 AB-08 只有旧的三道性能门禁；
#    本轮加 #5754 的管道冒烟（真实测量 + 落 run JSON）。正式基线 promote **不**
#    放进 campaign 臂：它要求「负载外」窗口，须单独在空闲宿主上执行。
# 5. **AB-05 增加 compat 脚本臂**（#5757）：001 的 B 轨 gate 因 Phase 2 未实现
#    硬编码 exit 1；compat 脚本以 77=NOT-RUN 三态独立取证，不与 gate 混判。
# 6. **新增 AB-11「本轮修复回归」**：把 #5498/#5503/#5711/#5712/#5507 引入的
#    判别式测试纳入取证面（否则这些修复在 campaign 里没有回归证据）。
#
# 前置条件（**未合并则相关臂必红，属预期**；Worker 不自合并，g3 receipts 域）：
#   #5753（心跳 emitter/checker + supervised wrapper）、#5754（AB-08 管道）、
#   #5755（soak 路径可移植 + unloaded fail-closed）、#5757（compat 语料）、
#   #5760（#5507 存储提交增量发布）、#5761（#5498 按合取计数）、
#   #5762（#5503 NOT-RUN 本地通道）、#5763（#5712 跨平台 CPU 计量）、
#   #5764（#5711 按测试名披露）。
