- log 001 反向变异自检：arms=11 discriminating=11（rc=0）。含 M3『restore 报成功但没落盘』、M6『NULL 歧义被抹平』、M7『IS NULL 谓词坏』、D2『判别臂没红
  ⇒ 判据失去判别力』四臂，全部判别。
- log 002 被测对象在位（含打折披露）：mysql 客户端真身是 /opt/homebrew/bin/mysql = **MariaDB 12.3.2 / client 15.2**，不是 Oracle
  MySQL 官方客户端 ⇒ 『真 MySQL 客户端』这一声称只在协议兼容层成立。server 二进制 target/debug/sqlrustgo-mysql-server 0.1.0，sha256
  b0900a5a37d9a5a3cd3608a3b8f92a85a5f87c5bfe3b3bc9a17fc5dd2fa6e646（与上一轮 scratch run2 同一份，未重编译）；git HEAD=e2a4dd6f85。
- FAIL(1) @ log 003 cap-live-prod：生产链 findings=1 = WIRE-1（SQL NULL 与字面量 'NULL' 在结果集里渲染成同一个 token）。这是**真缺陷**不是判据假红；本
  run 因此按 forensic 归档。
- log 004 摘要（本次真跑，非复用上一轮）：stage_eq_insert_vs_crash=true、stage_eq_crash_vs_restore=true、wal_nonempty=true、table_files_nonempty=true、restore_wrote_nothing=false、backup_rc=0
  backup_rows=5 restore_rc=0、prod_ddl_errors=0 prod_insert_errors=0；NULL 歧义复现（null_row='NULL' literal_row='NULL'）而服务端谓词侧
  is_null='1' eq_literal_NULL='1' 全对 ⇒ 缺陷在**结果集编码层**，不在谓词/存储层。
- 判据依据披露：『mysql --batch 下真 NULL 应渲染 \N』这条期望在 MariaDB client 上实测成立；Oracle 官方 mysql client 的 --batch 行为**未实测**
  ⇒ 那部分只能算『文档声称』。
- log 005 静态普查：scanned=164 个文件名/内容命中存储语义关键词的测试文件 ⇒ production_backed=74 / mock_only=71 / mixed=19。mock_only_files
