  HO-2 由 Owner 裁定（两条线的生成器 283 行 vs 236 行），本线不回刷对抢。'
- 度量现值：log 008 check_n=168 claims_hits=1144 docs410=81 audit_manifests_runs=29（上一 run 28⇒本 run 计数，不是分母）；log
  006/007 看板 55 行（未开始 8 / 待复核 20 / 完成 17 / 阻塞 10）；log 009 台账 findings=0 debt=1143 claims_ref=1。
- 台账可见性披露（重要，别误读）：看板 P1-2 行里写的 `run:20261106-cap-smoke-001` **不进台账分级**——该行不匹配 gov_probe.CLAIM_RE，所以既不算
  strong_bound 也不算 debt（log 009 读数在归档前后一字不变）。即「看板里写了 run:」不等于绑定生效，要让它生效必须先让那行含被判为『声称』的字样。
