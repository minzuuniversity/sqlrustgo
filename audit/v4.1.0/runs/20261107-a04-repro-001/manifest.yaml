notes: |
  2 条命令全绿，这是 IL-10 验收要求的**两臂对照**：
  - `a04-repro-current-engine`（当前构建的引擎二进制）⇒ `RESULT: PASS (with NOT RUN disclosure) - the verified subset is reproducible.`
    （NOT RUN 部分是本机没有 PostgreSQL 参考容器 ⇒ 那批 postgres 文件被点名披露，不是「验证过」）。
  - `a04-repro-stale-global-engine`（`SQLRUSTGO_BIN=$HOME/.cargo/bin/sqlrustgo` —— **2026-02-21 的陈旧全局安装**）
    ⇒ 同样是 `RESULT: PASS (with NOT RUN disclosure)`，其中 **40 条 NOT VERIFIED 里有 20 条是 `*_sqlrustgo_cli.txt`**，
    即该引擎那一路的 20 份文件被逐个点名披露为「本次未验证」；
    **该臂输出里 `drifted away` 出现 0 次** ⇒ 满足验收「门禁必须转 NOT RUN 披露、且不得再报『证据漂移』」。
  实测过程（两臂之前各跑过一次，用于定位）：陈旧二进制以 REPL 横幅形式响应 `sqlite --batch --mode csv --headers true --cmd`
  ⇒ 门禁的 `looks_like_repl_transcript` 判它不可用 ⇒ 不写文件 ⇒ 该路进入 NOT RUN 披露。
  **但**第一轮反向臂里门禁仍报漂移，原因是**另一处真实漂移**挡在前面：归档的
  `join_left_002_{mysql_cli,mysql_wire,sqlrustgo_cli}.txt` 记的是引擎旧行为（`ERROR 1105 (42000) … Join condition must
  reference one column from each side`），而当前引擎对同一条查询返回**正确行**（`1 one NULL` / `2 two 1`）
  —— 这来自有意修复 `ee0a47d280 fix(engine): #5361 合法的 LEFT JOIN 被拒绝（ON 子句含表达式）`。
  ⇒ 因此**先按最小范围重录这 3 份归档证据**（只改这 3 份，其余 97 份未动），门禁才可能给出干净的 NOT RUN 披露。
  环境注意：本 worktree 里 `target` 是指向共享 CARGO_TARGET_DIR 的**软链**（`/target` 已在 .git/info/exclude 里），
  否则矩阵产物会落在共享 target 而门禁读的是仓内相对路径 ⇒ 会误判成「本次没产出」。
  偏差按 §5.4.1 声明：CI 执行面已死（#5597）⇒ 本地归档 run 替代 CI 绿灯；无第二身份评审。
