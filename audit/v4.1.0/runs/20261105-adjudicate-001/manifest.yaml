  cwd: .
  timeout_sec: 1200
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" scripts/gate/expert_ladder.py adjudicate --id issue-5466-recheck --question audit/v4.1.0/adjudications/issue-5466-recheck.md
    --seat flash-next-252 --seat chatgpt-web --required-lineages 2 --machine-evidence audit/v4.1.0/adjudications/machine-evidence.jsonl
    --no-evidence-dir --max-tokens 600 >"$f" 2>&1

    rc=$?

    cat "$f"

    echo "exit_code=$rc"

    s=0

    [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || s=1

    grep -q ''"aggregate"'' "$f" || s=1

    grep -q ''verdicts'' "$f" || s=1

    rm -f "$f"

    exit $s

