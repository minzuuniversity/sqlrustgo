commands:
- id: ex9-census-print
  name: 留证：live issue 普查摘要（open_total 与 cost 标签分布）
  cmd: python3 scripts/gate/gov_probe.py issues | tail -1 > /tmp/ex9-census.json && cat /tmp/ex9-census.json
  cwd: .
  timeout_sec: 300
- id: ex9-census-baseline
  name: census 断言：open_total=112 且 cost 标签 t0=24/t1=65/t2=23（估算的分母来源）
  cmd: 'grep -q ''"open_total": 112'' /tmp/ex9-census.json && grep -q ''"cost/t0": 24'' /tmp/ex9-census.json
    && grep -q ''"cost/t1": 65'' /tmp/ex9-census.json && grep -q ''"cost/t2": 23'' /tmp/ex9-census.json
    && echo CENSUS-BASELINE-OK'
  cwd: .
  timeout_sec: 300
- id: ex9-seat-chatgpt
  name: 席位读数（lineage gpt / chatgpt-web）：EX-9 后该席位若返回占位文案必须直接退非零
  cmd: python3 scripts/gate/expert_ladder.py ask --seat chatgpt-web --question - --max-tokens 350 --timeout
    240 < audit/v4.1.0/est_prompt_2026-11-05.txt
  cwd: .
  timeout_sec: 280
- id: ex9-seat-flash
  name: 席位读数（lineage qwen / flash-next-252 @252:8001）：同一 prompt
  cmd: python3 scripts/gate/expert_ladder.py ask --seat flash-next-252 --question - --max-tokens 600 --timeout
    240 < audit/v4.1.0/est_prompt_2026-11-05.txt
  cwd: .
  timeout_sec: 280
- id: ex9-seat-deepseek-abstain
  name: 弃权现场必须仍在：deepseek-chat（EX-5 需人工登录）必须 fail-closed，不得被算作背书（R2）
  cmd: 'python3 scripts/gate/expert_ladder.py ask --seat deepseek-chat --question - --timeout 60 < audit/v4.1.0/est_prompt_2026-11-05.txt
    > /tmp/ex9-ds.json; rc=$?; if [ $rc -ne 0 ] && grep -q ''"ok": false'' /tmp/ex9-ds.json; then echo
    ABSTAIN-RECORDED deepseek-chat-exit=$rc; else echo MISMATCH-expect-abstain-rc=$rc; head -c 300 /tmp/ex9-ds.json;
    exit 1; fi'
  cwd: .
  timeout_sec: 200
- id: ex9-recompute-bind
  name: 文档↔事实绑定：估算文档每个派生数必须等于现算值，且本次席位读数不得整段偏离声称并集
  cmd: python3 audit/v4.1.0/est_recompute.py --plan docs/releases/v4.1.0/GOVERNANCE_REMEDIATION_PLAN_2026-11-04.md
    --doc docs/releases/v4.1.0/ESTIMATE_DOUBLE_LINEAGE_2026-11-05.md --require-run-id 20261105-est2-008
    --fresh-read audit/v4.1.0/runs/20261106-ex9-001/logs/003-ex9-seat-chatgpt.stdout --fresh-read audit/v4.1.0/runs/20261106-ex9-001/logs/004-ex9-seat-flash.stdout
    < /tmp/ex9-census.json
  cwd: .
  timeout_sec: 300
- id: ex9-recompute-mutations
  name: 反向变异：12 臂必须全部承重，2 条正臂（未变异基线 / 并集内读数）必须保持不红
  cmd: python3 audit/v4.1.0/est_recompute_mutations.py | tail -1 | grep -qx 'arms=12 flipped_red=12 stayed_green=0
    drift=0 positive_fail=0'
  cwd: .
  timeout_sec: 300
- id: ex9-placeholder-probe
  name: EX-9 判据：占位文案必须判弃权、长答案引用该词必须保持 ok（cases=6 failures=0）
  cmd: python3 audit/v4.1.0/placeholder_abstention_probe.py | tail -1 | grep -qx 'cases=6 failures=0 ladder=expert_ladder.py'
  cwd: .
  timeout_sec: 120
- id: ex9-placeholder-mutations
  name: EX-9 反向变异：三臂必须全翻红且未变异基线保持不红
  cmd: python3 audit/v4.1.0/placeholder_abstention_mutations.py | tail -1 | grep -qx 'arms=3 flipped_red=3
    stayed_green=0 drift=0 baseline_green=1'
  cwd: .
  timeout_sec: 180
- id: ex9-ladder-tests
  name: 席位梯夹具必须未红（含 EX-9 三条断言与 CONTROL 长答案对照）
