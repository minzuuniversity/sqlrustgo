  冻结口径：frozen_commit=a2ab388dd4（EX-9 修复提交：expert_ladder.http_chat 接 placeholder_content + 看板 EX-9 行）。自指披露：在飞 run 会被 check_audit_manifest.sh 与 gov_probe 的 audit_manifests 计数算进自己 ⇒ 本 run 入库后 audit_manifests 29→30、audit_manifests_runs 23→24，引用前必须复算。
