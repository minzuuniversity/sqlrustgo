  EX-9 的成因与修复效果对照：run 008 log 003 实测 chatgpt-web ok=true、finish_reason=stop、latency 58.77s，但 content 只有「无法加载此回复」9 个字（ChatGPT 网页桥的页面占位文案）。本 run log 003 同一席位、同一 prompt、同一命令：ok=true、finish=stop、latency 48.57s、正文含「估: 150-260 人日 / 20-36 周」。修复后若桥再返回占位文案，ask 会退 2（ok=false）⇒ 该命令当场红，不会再静默把页面错误当成一次有效血统计数。
- |
