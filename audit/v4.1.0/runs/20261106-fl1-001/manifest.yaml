    \ sqlrustgo-mysql-server --all-features --test file_storage_leading_column_collapse_5392 \\\n    \
    \   >\"test_results/fl1/run_$i.log\" 2>&1; then\n    ok=$((ok+1))\n  else\n    bad=$((bad+1))\n  \
    \  echo \"run $i RED —— 失败输出保留在 test_results/fl1/run_$i.log\"\n    tail -30 \"test_results/fl1/run_$i.log\"\
