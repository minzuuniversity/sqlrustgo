commands:
- id: gov-metrics
  name: 仓库治理度量（check_n/orphan/dead/docs410/claims_hits 等，去散文后的口径）
  cmd: python3 scripts/gate/gov_probe.py metrics
  cwd: .
  timeout_sec: 300
- id: gov-issue-census
  name: open issue 普查（priority/cost/cap 口径 + 分布汇总）
  cmd: python3 scripts/gate/gov_probe.py issues
  cwd: .
  timeout_sec: 300
- id: gov-issue-snapshot
  name: 重放台账输入快照拉取（证明 issues 输入可重放；重新拉取指纹随状态变化）
  cmd: python3 scripts/gate/gov_probe.py issues --dump /tmp/srg-issues/replay/all.json
  cwd: .
  timeout_sec: 300
- id: gov-probe-fixture
  name: gov_probe 判据夹具（含 P1/P2：注释与文档字符串里的门禁名不得计入引用）
  cmd: python3 scripts/gate/test_gov_probe.py
  cwd: .
  timeout_sec: 300
- id: expert-triage-fixture
  name: 专家分诊批量契约夹具（缺报=missing / 范围外=extra / 不可解析不编造）
  cmd: python3 scripts/gate/test_expert_triage.py
  cwd: .
  timeout_sec: 300
- id: kanban-fixture
  name: 看板渲染与校验夹具（删行必须红）
  cmd: python3 scripts/gate/test_kanban_render.py
  cwd: .
  timeout_sec: 300
- id: kanban-check
  name: 看板 MD 与 JSONL 台账一致性 + 计数
  cmd: python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
  cwd: .
  timeout_sec: 180
- id: ledger-verify
  name: issue 台账 run 级校验（L1 行数/L2 现场重算证据等级/L3 指纹/L4 缺行显式化）
  cmd: python3 audit/v4.1.0/verify_ledger.py
  cwd: .
  timeout_sec: 180
notes: 把 IL-1（106 个 open issue 台账化并分诊）的产物变成可重放证据： 台账 run 级校验 verify_ledger 的 L1-L4 判据、批量分诊契约夹具、 去散文后的度量口径（dead=62
  / docs410=71 / claims_hits=1132）。 本 run 不含 ci_gate.sh，不构成任何门禁 PASS 声明。 environment.worktree_clean=false
  仅因本 run 自身的 commit.txt/logs 尚未提交。 gov-issue-snapshot 的 dump 指纹可与台账记录的 all.json 指纹不同， 因为 issue 状态会随时间变化；台账记录的是分诊当时的指纹。
