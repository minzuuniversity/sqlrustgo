commands:
- id: audit-integrity-report
  name: 审计记录完整性实测：17 个历史运行目录分类（sound 10 / hollow 5 / partial 1 / no-manifest 1）
  cmd: python3 audit/v4.1.0/audit_integrity_report.py
  cwd: .
  timeout_sec: 300
- id: audit-manifest-fixture
  name: 反向夹具 CTRL/M1..M6：自造合法记录必须绿、六类破坏必须红
  cmd: python3 scripts/gate/test_audit_manifest_integrity.py
  cwd: .
  timeout_sec: 300
- id: audit-gate-currently-red
  name: 断言 check_audit_manifest.sh 退出码确为 1（该门禁已知红，本探针只证判据未坏，不构成门禁通过声明）
  cmd: bash -c 'bash scripts/gate/check_audit_manifest.sh >/dev/null 2>&1; test $? -eq 1'
  cwd: .
  timeout_sec: 300
- id: audit-gate-red-count-legacy
  name: 历史记录红数精确核对：iaia410- 前缀必须恰为 7（5 hollow + 1 partial + 1 无清单）
  cmd: 'bash -c ''bash scripts/gate/check_audit_manifest.sh 2>&1 | grep -c "^FAIL: .*iaia410-" | grep
    -qx 7'''
  cwd: .
  timeout_sec: 300
- id: audit-gate-selfref-observed
  name: 看板 IL-6 现场取证：门禁把本 run 目录也计入 => 总红数 8 且含本 run id（自指复现，非门禁通过声明）
  cmd: bash -c 'out=$(bash scripts/gate/check_audit_manifest.sh 2>&1); n=$(printf "%s\n" "$out" | grep
    -c "^FAIL:"); m=$(printf "%s\n" "$out" | grep -c "^FAIL:.*20261105-auditintegrity-002"); test "$n"
    -eq 8 -a "$m" -eq 1'
  cwd: .
  timeout_sec: 300
- id: gate-registry-check
  name: 登记表一致性：分母仍 168、class 仍 34/51/22/61、fails=0
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 300
- id: gate-registry-fixture
  name: 登记表反向夹具 9 条变异必须全部被抓
  cmd: python3 scripts/gate/test_gate_registry.py
  cwd: .
  timeout_sec: 300
- id: gov-probe-metrics
  name: 口径度量重放：check_n=168 orphan=83 dead=61 claims_hits=1132 docs410=72 topmd=45（自指漂移检查）
  cmd: python3 scripts/gate/gov_probe.py metrics
  cwd: .
  timeout_sec: 300
- id: kanban-check
  name: 看板 SSOT 校验：39 行、md 与 jsonl 一致
  cmd: python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
  cwd: .
  timeout_sec: 120
notes: 'P0-6 / IL-5 / IL-6 取证（第一版 20261105-auditintegrity-001 因自指 FAIL(1)，取证留 /tmp/srg-forensic/，未提交）。

  口径声明：本 run 不含 ci_gate.sh，不构成任何门禁 PASS 声明。check_audit_manifest.sh 在冻结树上确实红，audit-gate-currently-red 与
  audit-gate-red-count-legacy 只断言「该门禁当前确实红、且历史不可复核记录恰为 7 条」，是判据未坏的对照片段，不表示门禁通过。

  audit-gate-selfref-observed 现场复现看板 IL-6：门禁扫描 runs/ 时把正在执行的 run 目录也计入，run 进行中总红 8（含本 run id）、历史记录红 7；run
  结束后重扫回到 7。

  worktree_clean=false 仅因本 run 的 logs 与 freeze 指针尚未提交，frozen_commit 本身即被检代码。'
