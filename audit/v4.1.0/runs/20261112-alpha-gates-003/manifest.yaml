- 清单来源：audit/v4.1.0/commands_alpha_gates_003.yaml（随本 run 收录为 commands.yaml）。与仓内既有
  001/002 两份 ALPHA 清单的**唯一**差异：`alpha-gate-check-alpha-v410` 臂的 timeout_sec 1800 →
  10800 —— 该聚合门禁内部会跑 llvm-cov 覆盖率，在共享开发机上超过 30 分钟，1800s 预算会把它杀掉（rc=124）⇒ 门禁自身的逐项结果全部丢失
  ⇒ 「预算不足」不是「门禁不过」。
- 执行纪律（计划 §7）：工作树的 target 指向共享 CARGO_TARGET_DIR（软链）⇒ 崩溃用例能找到 target/debug/sqlrustgo-mysql-server，覆盖率也不会对着正在重建的
  target 测量。
- 顺序要求：audit_run.py freeze 必须先于 scaffold（scaffold 从 commit.txt 取冻结值）。
