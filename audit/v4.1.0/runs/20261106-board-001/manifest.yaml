notes:
  - >-
    本 run 不是全绿：23 条命令里 3 条非 0，逐条记账如下，不做任何掩盖或事后修饰。
  - >-
    crash-wal-index exit_code=101 是已知真红，不是本批引入：在 develop 基点 307db14c2b 上独立测过该家族 11 passed / 1 failed，红项 index_update_crash_does_not_serve_dangling_rows panic at crates/storage/tests/crash_wal_index_b1.rs:231:25，seed 阶段即报 ERROR 1146 (42000) Table not found: t。记账看板 ENG-13，对应 issue #5584（该 issue 带 state/claimed 与 agent:openclaw-mcode，归属另一条线，本线不抢）。
  - >-
    gate-main-freshness exit_code=1 是结构红：BRANCH_GOVERNANCE 第 14 节的 C-MAIN-02 规定 main 由 release/* 单向驱动，4.1.0 GA 之前 main 不推进；本批按属主指令只往 develop/v4.1.0 合，绝不动 main。该门禁在 GA 前不可能转绿，属发布侧/属主侧事项，不是本批回归。
  - >-
    test-5392-regression exit_code=101 是命令内的不稳定项：红项 a_keyed_table_with_repeated_leading_column_keeps_every_loaded_row 在 crates/mysql-server/tests/file_storage_leading_column_collapse_5392.rs:98:30 报 LOAD DATA: Io(Custom { kind: UnexpectedEof, error: unexpected EOF during read_exact }) —— 服务端连接在 20000 行 LOAD DATA 途中断开，不是行数断言失败。同一 tip 上随后复测同一条命令：整文件 5 passed / 29.50s，rc=0。因此 #5392 的 inner 层并集修复本身没有回归（该臂修复前是 affected_rows=20000 而 COUNT=5001 的确定性红，现已不复现），但 LOAD DATA 规模下把连接打断属于可复现性缺陷，另立看板行 FL-1 记账。
  - >-
    IL-13 的验收证据就是本 run：崩溃/恢复四套件（crash_commit_fsync_b1 / crash_wal_index_b1 / e2e_crash_recovery_proof / multi_db_crash_recovery_5192）首次进入归档命令集；此前 41 个归档 run 的 manifest 里 crash_wal_index 出现 0 次，所以那些 run 的『全部 exit_code 0』对崩溃安全没有证明力。
  - >-
    前置 prereq-armed-server 断言 server 二进制里含 SQLRUSTGO_FAULT_POINT（fault-injection 特性确实编进去），四条崩溃命令再用 SQLRUSTGO_SERVER_BIN 显式钉死二进制路径：该套件的默认解析是按被测 worktree 自己的 target/ 找，共享 CARGO_TARGET_DIR 时会把『二进制没找到』伪装成崩溃安全缺陷 —— 这正是 ENG-12 此前误判的直接原因，公开更正见 #5376 评论 205605（撤回评论 205561 与 205565）。
  - >-
    环境：CARGO_TARGET_DIR 由 runner 导出并记在 environment 段（与主仓共享热缓存，避免每条命令冷编译）；tpch 的 fixture 与输出写在 /Volumes/workspace/dev 与 /tmp 下，不入库。tests/baseline/test_count.json 由单调门禁自抬，已在 70cd1fb168 入库，故 run 期间不再改写工作区。
  - >-
    本 run 故意不含 cargo fmt --check --all：develop 基点本身 fmt 是红的（crates/storage/src/mvcc_storage.rs、crates/mysql-server/tests/file_storage_leading_column_collapse_5392.rs、crates/tools/tests/backup_restore_closed_loop_5525.rs 等），那是两条线的既有欠账，修复提交在 CI 线的 64e40544ac；把它塞进本 run 只会制造与本批代码无关的红。本批只保证自己新增的测试代码 rustfmt 干净。
