commands:
- id: walgc2-group-commit-module
  name: group_commit 模块全部测试(8:WALGC-1 既有 5 + WALGC-2 新增 3;先红探针转正)
  cmd: cargo test -q -p sqlrustgo-storage wal::group_commit
  cwd: .
  timeout_sec: 1800
- id: walgc2-storage-crate
  name: storage crate 全测试面(919,含协调器与 WAL 全链;SIGKILL 崩溃矩阵经 SQLRUSTGO_SERVER_BIN 指向冻结提交上 fault-injection
    构建)
  cmd: SQLRUSTGO_SERVER_BIN=/Volumes/workspace/dev/walgc2-target/debug/sqlrustgo-mysql-server cargo test
    -q -p sqlrustgo-storage
  cwd: .
  timeout_sec: 3600
- id: walgc2-lib
  name: 引擎 lib 测试面(协调器调用方波及)
  cmd: cargo test --lib
  cwd: .
  timeout_sec: 5400
- id: walgc2-clippy-storage
  name: clippy 存储 crate(判据:-D warnings 面 0 warning,无新增 allow)
  cmd: cargo clippy -q -p sqlrustgo-storage -- -D warnings
  cwd: .
  timeout_sec: 1800
- id: walgc2-anti-ignore
  name: anti-ignore 门禁(136/82 口径:ignore 与 allow 计数不放松,WALGC-2 未新增任何豁免)
  cmd: bash scripts/gate/check_anti_ignore_gate.sh
  cwd: .
  timeout_sec: 900
- id: walgc2-fmt
  name: cargo fmt --check --all(尖端 0 diff 口径保持)
  cmd: cargo fmt --check --all
  cwd: .
  timeout_sec: 300
- id: walgc2-wal-integration
  name: WAL 集成族(wal_integration_test + wal_tx_contract_test;冻结提交上复证)
  cmd: cargo test -q --test wal_integration_test --test wal_tx_contract_test
  cwd: .
  timeout_sec: 3600
- id: walgc2-parser-smoke
  name: parser crate 冒烟(上一取证链基线保持:28 目标全绿)
  cmd: cargo test -q -p sqlrustgo-parser
  cwd: .
  timeout_sec: 1800
- id: walgc2-arch-invariants
  name: 架构不变量门禁(协调器修改不得破坏 arch 判据)
  cmd: bash scripts/gate/check_arch_invariants.sh
  cwd: .
  timeout_sec: 900
- id: walgc2-commit-msg-gate
  name: 提交信息门禁(本链代码提交 L1/L2/L3)
  cmd: bash scripts/gate/check_commit_message.sh --range HEAD~2..HEAD --require-refs
  cwd: .
  timeout_sec: 300
