commands:
- id: negfix-ledger-regen
  name: 台账可从干净检出复现（生成器已进仓，再生产物必须与在仓版本逐字节一致）
  cmd: bash -c 'python3 audit/v4.1.0/gen_neg_ledger.py 20261105-negfix-003 >/dev/null
    && git diff --quiet -- docs/releases/v4.1.0/NEG_FIXTURES_v4.1.0.jsonl && echo
    LEDGER-REGEN-IDENTICAL || { echo LEDGER-REGEN-DIFFERS; git status --short -- docs/releases/v4.1.0/NEG_FIXTURES_v4.1.0.jsonl;
    exit 1; }'
  cwd: .
  timeout_sec: 300
- id: negfix-ledger-check
  name: 台账结构/语义/证据落盘对账（缺 run 时 fail-closed）
  cmd: python3 audit/v4.1.0/probe_neg_fixtures.py check
  cwd: .
  timeout_sec: 300
- id: negfix-scratch-add
  name: 建 detached scratch 工作树（夹具只在此树内注入）
  cmd: git worktree add --detach /private/tmp/negfix-20261105-negfix-003 "$(git rev-parse
    HEAD)"
  cwd: .
  timeout_sec: 300
- id: neg-fixtures
  name: 门禁判定类夹具注入缺陷跑真实门禁（14 条，selftest-red 类显式 DEFERRED）
  cmd: python3 audit/v4.1.0/probe_neg_fixtures.py fixtures --tree /private/tmp/negfix-20261105-negfix-003
  cwd: .
  timeout_sec: 1800
- id: neg-selftests
  name: 行为判据：干净 selftest 必须 0，致残检测器后必须翻红
  cmd: python3 audit/v4.1.0/probe_neg_fixtures.py selftests --tree /private/tmp/negfix-20261105-negfix-003
  cwd: .
  timeout_sec: 1200
- id: fx14-reverse-pair
  name: SC-1 反向变异对：同一夹具打修复前 9f82eeb777 必须判 FIXTURE-FAIL(rc=3)
  cmd: 'bash -c ''git worktree add --detach /private/tmp/negfix-410-pre 9f82eeb777
    >/dev/null && { bash audit/v4.1.0/neg/fx14-stage-version-uninferable.sh /private/tmp/negfix-410-pre
    > /tmp/fx14-pre.log 2>&1; rc=$?; git worktree remove --force /private/tmp/negfix-410-pre;
    sed -n "1,20p" /tmp/fx14-pre.log; if [ "$rc" -eq 3 ]; then echo FX14-REVERSE-PAIR-OK:
    fixture says NOT-OK on the pre-fix driver; exit 0; else echo FX14-REVERSE-PAIR-BAD:
    rc=$rc want 3; exit 1; fi; }'''
  cwd: .
  timeout_sec: 400
- id: negfix-mutation-11arms
  name: 探针反向变异 11 臂（先要求台账基线零发现）
  cmd: python3 audit/v4.1.0/probe_neg_fixtures.py mutation-selftest
  cwd: .
  timeout_sec: 600
- id: stage-driver-resolve
  name: SC-1 正向回归：非发布线分支上驱动必须解析 v4.1.0（改前实测 v3.9.0）
  cmd: 'bash -c ''out=$(bash scripts/gate/check_stage.sh --stage ALPHA --dry-run 2>&1);
    echo "$out" | sed -n "1,8p"; echo "$out" | grep -q "^  Version: v4\.1\.0$" &&
    echo STAGE-DRIVER-RESOLVES-V410 || { echo STAGE-DRIVER-WRONG-VERSION; exit 1;
    }'''
  cwd: .
  timeout_sec: 300
- id: negfix-scratch-remove
  name: 清理 scratch 工作树
  cmd: git worktree remove --force /private/tmp/negfix-20261105-negfix-003
  cwd: .
  timeout_sec: 300
- id: gate-registry-check
  name: 门禁清单回归（分母必须仍是 168）
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 300
- id: gate-registry-fixtures
  name: 门禁清单回归夹具
  cmd: python3 scripts/gate/test_gate_registry.py
  cwd: .
  timeout_sec: 300
- id: kanban-44-rows
  name: 看板 SSOT 渲染一致性（44 行）
  cmd: bash -c 'python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
    | grep -q "44 rows"'
  cwd: .
  timeout_sec: 120
- id: gov-probe-metrics
  name: 自指度量当期取值（neg_fixture_n 关键字口径见 NEG_FIXTURE_PROGRAM §6）
  cmd: python3 scripts/gate/gov_probe.py metrics
  cwd: .
  timeout_sec: 900
