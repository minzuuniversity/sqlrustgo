commands:
- id: dirt1-ci-wiring-target
  name: 整个 ci_wiring_honesty_test 目标（含 3 条新增 DIRT-1 判据 + 既有 31 条）
  cmd: cargo test -q --test ci_wiring_honesty_test
  cwd: .
  timeout_sec: 3600
- id: dirt1-worktree-clean-after-replay
  name: 重放 CI step 之后：受跟踪文件不得有任何改动（含模式位）——DIRT-1 的验收判据
  cmd: "st=\"$(git status --porcelain --untracked-files=no)\"\nif [ -n \"$st\" ]; then\n  printf 'DIRT（工作树被改动，DIRT-1\
    \ 仍在）:\\n%s\\n' \"$st\"\n  exit 1\nfi\necho \"CLEAN: 跑完 ci_wiring_honesty_test（它会重放 Version detection\
    \ step 体）后，受跟踪文件零改动\"\n"
  cwd: .
  timeout_sec: 120
- id: dirt1-resolver-index-mode
  name: resolve_release_version.sh 的登记模式必须是 100755（与其余 17 个 chmod 目标一致）
  cmd: 'm="$(git ls-files -s scripts/gate/resolve_release_version.sh | awk ''{print $1}'')"

    if [ "$m" = 100755 ]; then echo "OK mode=$m"; else echo "BAD mode=$m"; exit 1; fi

    '
  cwd: .
  timeout_sec: 120
- id: dirt1-no-stray-chmod-on-tracked
  name: 全仓扫一遍：还有谁对受跟踪的 644 文件 chmod（判据的覆盖面自检）
  cmd: "hits=0\nwhile IFS= read -r f; do\n  while IFS= read -r t; do\n    # 目录结尾的目标（`chmod +x scripts/gate/$g.sh`\
    \ 被字符类截断成 `scripts/gate/`）\n    # 不是具体文件，git ls-files 会把整目录列出来 ⇒ 必然误报，跳过。\n    [ -n \"$t\" ] || continue\n\
    \    case \"$t\" in */) continue ;; esac\n    m=\"$(git ls-files -s -- \"$t\" | awk '{print $1}')\"\
    \n    if [ -n \"$m\" ] && [ \"$m\" != 100755 ]; then\n      printf 'HIT %s chmods %s (index %s)\\\
    n' \"$f\" \"$t\" \"$m\"; hits=$((hits+1))\n    fi\n  done < <(grep -rhoE 'chmod \\+x [A-Za-z0-9_./-]+'\
    \ \"$f\" | awk '{print $3}' | sort -u)\ndone < <(grep -rlE 'chmod \\+x ' tests scripts/gate .gitea/workflows\
    \ 2>/dev/null)\necho \"可疑 chmod 目标计数: $hits\"\n[ \"$hits\" -eq 0 ]\n"
  cwd: .
  timeout_sec: 300
- id: gate-registry-denominator
  name: 门禁分母与登记表一致（不得因本批变动）
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 300
- id: probe-gate-registry
  name: 登记表夹具（9 条反向变异必须全部被抓）
  cmd: python3 scripts/gate/test_gate_registry.py
  cwd: .
  timeout_sec: 300
- id: gate-kanban-consistency
  name: 看板 md 与 jsonl 一致
  cmd: python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
  cwd: .
  timeout_sec: 300
- id: gate-honesty-check
  name: honesty.py 判据
  cmd: python3.14 audit/v4.1.0/honesty.py check
  cwd: .
  timeout_sec: 300
- id: gate-doc-facts-check
  name: doc_facts 判据（指针与链接）
  cmd: python3.14 audit/v4.1.0/doc_facts.py check
  cwd: .
  timeout_sec: 600
- id: gate-fmt-check
  name: 新增测试必须 rustfmt 干净
  cmd: cargo fmt --check --all
  cwd: .
  timeout_sec: 600
- id: gate-main-freshness
  name: main 新鲜度（GA 前结构性红，C-MAIN-02）
  cmd: bash scripts/gate/check_main_freshness.sh
  cwd: .
  timeout_sec: 300
