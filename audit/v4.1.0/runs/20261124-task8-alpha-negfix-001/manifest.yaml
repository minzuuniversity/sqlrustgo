notes:
- Task 8（ALPHA 阶段执行点与 7 道负向夹具）修订 2 重建的证据 run。
- '**全部 17 条命令都在同一个 commit 上执行**（b556199c86ae829f5f2f9f1c57e24dae43ef84c8）：本 run 的
  manifest 的 frozen_commit 指向它，results[] 里每一条也各自记着同一个 commit（commit 字段）。manifest 自己进在更晚的提交里
  —— 这是仓库既有惯例（历史 run 的 frozen_commit 也是它判定的那一个提交，manifest 在更晚的提交里入库），不是循环依赖。'
- 001 是七道 ALPHA 门禁的两层 RED 逐道验证；它的退出码是 3：verify_neg_fixtures.sh 只有 7/7 才退出 0，本次是 RED=6/7、INCONCLUSIVE=1/7（覆盖率门禁）。非
  0 是设计意图 —— 超时/不可归因一律报 INCONCLUSIVE，不许凑数（R50）。
- 003 是仓库自己的夹具泳道（probe_neg_fixtures.py fixtures）：audit/v4.1.0/neg/ 下每个 fx*.sh 都必须声明自己的期望值；共享
  helper 因此改名为 neg_two_layer.sh（否则它落进 fx*.sh 的 glob 里，expect_of() 返回 None ⇒ UNDECLARED-EXPECT
  ⇒ 该子命令退出 1）。
- '016 是端到端证据：阶段驱动在完整 ALPHA 清单上真跑了一遍（10 条 required_gates，含 3 条 cargo），耗时 23m58.64s，退出码
  1（冻结基线上 ALPHA 本来就红：composite、覆盖率门禁、anti_ignore、cargo fmt --check），其余六条 PASS。**时间窗是从证据推定的**，不是手填的：驱动的判决记录
  docs/releases/v4.1.0/logs/gate_alpha_b556199c86_20261124_190447Z.log 与本条 stdout
  逐字节相同，它文件名里的 20261124_190447Z 来自 check_stage.sh:353 的 date -u（取在门禁执行之前）⇒ 起 2026-11-24T19:04:47Z；该文件的
  mtime 是 19:28:45Z，而 19:04:47Z + 23m58.64s = 19:28:45.64Z ⇒ 止 2026-11-24T19:28:46Z。它的预算给到
  10800s（= workflow 的 timeout-minutes: 180）：在夹具泳道刚改过 Rust 源码的树上，composite 内部的 release
  构建要重跑，90 分钟不够 —— 实测两次撞墙（判决记录分别是 gate_alpha_b556199c86_20261124_155056Z.log 与 …_173346Z.log，那两次的
  rc=124 属超时、不在本 run 的 results[] 里），180 分钟跑完。'
- 011（verify_handoff）与 010（verify_sha_scope）在**重签之后**的那棵树上跑，退出码 0 —— 上一版 manifest
  里记着的那条 rc=1（重签之前抓到的旧状态：handoff manifest 的哈希范围里 test_verify_sha_scope.py 的哈希与文件内容对不上）已经被本
  run 的这一条取代，本 run 里不再 留任何一条会让人读成「某个检查现在是红的」的记录。
- 002 与 015 是同一条台账对账命令的两个时刻，都退出 0（这一轮重建时证据 run 目录已经存在，所以 002 不再是上一版那条 'NO-EVIDENCE-RUN'
  的自举状态 —— 上一版的那条红已经被本 run 的这两条取代）。
- 017 是覆盖率门禁在完整树上的基线取值：退出码 1 —— 门禁在未注入缺陷时就是红的（sqlrustgo-storage 量不出覆盖率表，因为 Task 1–7
  导入的 RED 特征测试 crates/storage/tests/tf_t4_*.rs 按设计失败）。这正是 fx18 判 INCONCLUSIVE 的依据：红不可归因于夹具注入的缺陷。
- 001 的 stdout 逐道记录了每道夹具的 gate=RED/stage=RED 与 fixture_rc；每道夹具脚本自己的输出（stdout+stderr
