- 本 run 记录 Task 8（ALPHA 阶段执行点与 7 道负向夹具）修订 1 的实跑证据。
- 001 是七道 ALPHA 门禁的两层 RED 逐道验证；它的退出码是 3：verify_neg_fixtures.sh 只有 7/7 才退出 0，本次是 RED=6/7、INCONCLUSIVE=1/7（覆盖率门禁）。非
  0 是设计意图 —— 超时/不可归因一律报 INCONCLUSIVE，不许凑数（R50）。
- 003 是仓库自己的夹具泳道（probe_neg_fixtures.py fixtures）：audit/v4.1.0/neg/ 下每个 fx*.sh 都必须声明自己的期望值；共享
  helper 因此改名为 neg_two_layer.sh（否则它落进 fx*.sh 的 glob 里，expect_of() 返回 None ⇒ UNDECLARED-EXPECT
  ⇒ 该子命令退出 1）。
- 016 是 R60 的端到端证据：阶段驱动在完整 ALPHA 清单上真跑了一遍（10 条 required_gates，含 3 条 cargo），耗时 27m06s，退出码
  1（冻结基线上 ALPHA 本来就红：Q1_FMT / Q2_ANTI_FAB / Q3_ANTI_IGNORE / 覆盖率门禁），其中 cargo build
  --all-features、cargo test --all-features --lib、check_g1_tpch_baseline.sh、check_sql_corpus_gate.sh、check_arch_invariants.sh、check_arch3_no_bypass.sh
  都是 PASS。
- 002 与 015 是同一条命令的两个时刻：002 跑在证据 run 目录存在之前（报 NO-EVIDENCE-RUN，台账自举的先后问题），015 跑在目录存在之后，退出码
  0。
- 017 是覆盖率门禁在完整树上的基线取值：退出码 1 —— 门禁在未注入缺陷时就是红的（sqlrustgo-storage 量不出覆盖率表，因为 Task 1–7
  导入的 RED 特征测试 crates/storage/tests/tf_t4_*.rs 按设计失败）。这正是 fx18 判 INCONCLUSIVE 的依据：红不可归因于夹具注入的缺陷。
- logs/fixtures/ 下是 001 每一道夹具的逐道日志。
- 本 run 不含 ci_gate.sh，不构成门禁 PASS 声明。
