notes:
- 本 run 记录 Task 8（ALPHA 阶段执行点与 7 道负向夹具）的实跑证据：001 是七道 ALPHA 门禁的两层 RED 逐道验证，002..013
  是既有校验器，014 是覆盖率门禁在完整树上的基线取值（fx18 的对照组）。
- 001 的退出码是 3：verify_neg_fixtures.sh 只有 7/7 才退出 0，本次是 RED=6/7、INCONCLUSIVE=1/7（覆盖率门禁）。非
  0 是设计意图 —— 超时/不可归因一律报 INCONCLUSIVE，不许凑数（R50）。
- 002（台账对账）在证据 run 目录存在**之前**执行，因此报 NO-EVIDENCE-RUN；这是台账自举的先后问题，不是台账内容有问题 —— 015 是目录存在之后重跑的那次，退出码
  0。
- 014 的退出码是 1：覆盖率门禁在完整树上本来就是红的（sqlrustgo-storage 量不出覆盖率表，因为 Task 1–7 导入的 RED 特征测试
  crates/storage/tests/tf_t4_*.rs 按设计失败）。这正是 fx18 判 INCONCLUSIVE 的原因：红不可归因于夹具注入的缺陷。
- logs/fixtures/ 下是 001 每一道夹具的逐道日志（夹具脚本自身的 stdout）。
- 本 run 不含 ci_gate.sh，不构成门禁 PASS 声明。
