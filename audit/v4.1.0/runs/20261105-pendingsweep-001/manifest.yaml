commands:
- id: adjudicate-pending-claims
  name: 双血统裁定：8 条「已实现但只到待复核」的声称（主证据 = 归档 run 原始输出）
  cwd: .
  timeout_sec: 1800
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" scripts/gate/expert_ladder.py adjudicate --id pending-claims-sweep --question audit/v4.1.0/adjudications/pending-claims-sweep.md
    --seat flash-next-252 --seat chatgpt-web --required-lineages 2 --machine-evidence audit/v4.1.0/adjudications/machine-evidence.jsonl
    --no-evidence-dir --max-tokens 1200 >"$f" 2>&1

    rc=$?

    cat "$f"

    echo "exit_code=$rc"

    s=0

    [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || s=1

    grep -q ''"aggregate"'' "$f" || s=1

    grep -q ''verdicts'' "$f" || s=1

    grep -q ''pending-claims-sweep'' "$f" || s=1

    rm -f "$f"

    exit $s

    '
- id: ex6-failure-accounting
  name: EX-6 标定账把「超时」与「答错」分开记（四臂，含反向变异）
  cwd: .
  timeout_sec: 600
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" audit/v4.1.0/ex6_failure_accounting.py >"$f" 2>&1

    rc=$?

    cat "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    rm -f "$f"

    exit $s

    '
- id: prod-storage-gate
  name: 生产存储门禁 R1–R6 全成立
  cwd: .
  timeout_sec: 900
  cmd: 'f="$(mktemp)"

    bash scripts/gate/check_correctness_tests_production_storage.sh >"$f" 2>&1

    rc=$?

    grep -E "=== Result" "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    grep -q "FAIL=0" "$f" || s=1

    rm -f "$f"

    exit $s

    '
- id: audit-manifest-baseline
  name: A01 证据门禁仍是那 7 条历史红（未放宽）
  cwd: .
  timeout_sec: 600
  cmd: 'f="$(mktemp)"

    bash scripts/gate/check_audit_manifest.sh >"$f" 2>&1

    rc=$?

    n=$(grep -c "^FAIL:" "$f")

    echo "exit_code=$rc fail_count=$n"

    s=0

    [ "$rc" -eq 1 ] || s=1

    [ "$n" -eq 7 ] || s=1

    rm -f "$f"

    exit $s

    '
