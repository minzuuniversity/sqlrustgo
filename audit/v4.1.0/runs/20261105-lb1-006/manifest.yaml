commands:
- id: lb1-check-before-red
  name: 整改前夹具必须判红（判红条件仍在，否则核对器是摆设）
  cmd: 'bash -c ''out=$(python3 audit/v4.1.0/issue_labels.py check --input audit/v4.1.0/neg/snapshots/labelgap-open-before-20261105.jsonl
    --ledger docs/releases/v4.1.0/ISSUE_LABEL_LEDGER_v4.1.0.jsonl 2>&1); rc=$?; echo "$out" | head -3;
    if [ "$rc" -eq 0 ]; then echo "BASELINE-NOT-RED: 整改前夹具本该判红"; exit 1; fi; echo "BASELINE-BEFORE-RED-OK
    rc=$rc"'''
  cwd: .
  timeout_sec: 300
- id: lb1-check-after-green
  name: 整改后夹具必须判绿（不是永远红的摆设）
  cmd: 'bash -c ''out=$(python3 audit/v4.1.0/issue_labels.py check --input audit/v4.1.0/neg/snapshots/labelgap-open-after-20261105.jsonl
    --ledger docs/releases/v4.1.0/ISSUE_LABEL_LEDGER_v4.1.0.jsonl 2>&1); rc=$?; echo "$out" | head -3;
    if [ "$rc" -ne 0 ]; then echo "BASELINE-AFTER-RED: 整改后夹具必须绿"; exit 1; fi; echo "BASELINE-AFTER-GREEN-OK
    rc=$rc"'''
  cwd: .
  timeout_sec: 300
- id: lb1-check-live
  name: live 三维缺口必须全 0（priority/cost/cap 各维均无缺维）
  cmd: 'bash -c ''out=$(python3 audit/v4.1.0/issue_labels.py check 2>&1); rc=$?; echo "$out" | head -3;
    if [ "$rc" -ne 0 ]; then echo "LIVE-GAP-NONZERO"; exit 1; fi; echo "$out" | grep -q "\"findings\":
    0" || { echo "LIVE-FINDINGS-NONZERO"; exit 1; }; echo "LIVE-GAP-ZERO-OK"'''
  cwd: .
  timeout_sec: 300
- id: lb1-mutation-7arms
  name: 七臂反向变异全判别（arms=7 discriminating=7 not_discriminating=0 drift=0）
  cmd: bash -c 'out=$(python3 audit/v4.1.0/issue_labels_mutations.py 2>&1); rc=$?; echo "$out"; if [ "$rc"
    -ne 0 ]; then echo "MUTATION-RC-NONZERO rc=$rc"; exit 1; fi; echo "$out" | grep -q "arms=7 discriminating=7
    not_discriminating=0 drift=0" || { echo "ARMS-SUMMARY-MISMATCH"; exit 1; }; echo "ARMS-SUMMARY-OK"'
  cwd: .
  timeout_sec: 600
- id: lb1-arm-count-external
  name: 臂数外部核对：claimed arms= 必须等于实际 verdict 行数；写死臂数必须被抓；lost 守卫变异必须判别
  cmd: python3 audit/v4.1.0/lb1_arm_count_check.py
  cwd: .
  timeout_sec: 900
- id: lb1-verify-no-loss
  name: verify 对 live：lost_labels=0 且 added_labels==expected_ops_from_ledger==43
  cmd: 'bash -c ''out=$(python3 audit/v4.1.0/issue_labels.py verify audit/v4.1.0/neg/snapshots/labelgap-open-before-20261105.jsonl
    2>&1); rc=$?; echo "$out"; if [ "$rc" -ne 0 ]; then echo "VERIFY-RC-NONZERO rc=$rc"; exit 1; fi; echo
    "$out" | grep -q "\"lost_labels\": 0" || { echo "LOST-LABELS-NONZERO"; exit 1; }; echo "$out" | grep
    -q "\"added_labels\": 43" || { echo "ADDED-NOT-43"; exit 1; }; echo "$out" | grep -q "\"expected_ops_from_ledger\":
    43" || { echo "EXPECTED-NOT-43"; exit 1; }; echo "VERIFY-NO-LOSS-OK"'''
  cwd: .
  timeout_sec: 300
- id: lb1-plan-zero
  name: live 上 plan 的 ops 必须为 0（稳态判据：标签已全部落库）
  cmd: 'bash -c ''out=$(python3 audit/v4.1.0/issue_labels.py plan 2>&1); rc=$?; echo "$out" | tail -3;
    if [ "$rc" -ne 0 ]; then echo "PLAN-RC-NONZERO rc=$rc"; exit 1; fi; echo "$out" | grep -q "^ops: 0$"
    || { echo "PLAN-OPS-NONZERO"; exit 1; }; echo "PLAN-ZERO-OK"'''
  cwd: .
  timeout_sec: 300
- id: lb1-census-summary
  name: gov_probe issues 摘要：三维不得出现 (none) 键
  cmd: bash -c 'out=$(python3 scripts/gate/gov_probe.py issues 2>&1); rc=$?; if [ "$rc" -ne 0 ]; then
    echo "GOV-ISSUES-RC-NONZERO rc=$rc"; exit 1; fi; echo "$out" | tail -1; if echo "$out" | grep -q "(none)";
    then echo "NONE-KEY-PRESENT"; exit 1; fi; echo "CENSUS-NO-NONE-KEY-OK"'
  cwd: .
  timeout_sec: 600
- id: lb1-doc-claims-clean
  name: LB1/GEN1 两份报告不得出现 PASS/全绿/✅ 结论字样
  cmd: bash -c 'rc=0; for f in docs/releases/v4.1.0/LB1_ISSUE_LABEL_TAXONOMY_2026-11-05.md docs/releases/v4.1.0/GEN1_KANBAN_ISSUE_GENERATOR_2026-11-05.md;
    do n=$(grep -c "PASS\|全绿\|✅" "$f"); echo "$f claims_hits=$n"; if [ "$n" -ne 0 ]; then rc=1; fi; done;
    if [ "$rc" -ne 0 ]; then echo "CLAIMS-NOT-CLEAN"; exit 1; fi; echo "DOC-CLAIMS-CLEAN-OK"'
  cwd: .
  timeout_sec: 300
- id: gen1-selftest
  name: 看板生成器 selftest 四臂
  cmd: python3 audit/v4.1.0/gen_kanban_issue.py --selftest
  cwd: .
  timeout_sec: 300
- id: gen1-mutation-4arms
  name: GEN-1 反向变异四臂（stayed_green=0 drift=0）
  cmd: python3 audit/v4.1.0/gen_kanban_issue_mutations.py
  cwd: .
  timeout_sec: 600
- id: kanban-45-rows
  name: 看板 SSOT 渲染一致性（46 行，含 HO-1）
  cmd: bash -c 'python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
    | grep -q "46 rows"'
  cwd: .
  timeout_sec: 120
- id: gate-registry-check
  name: 门禁清单回归（分母必须仍是 168）
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 300
- id: gate-registry-fixtures
  name: 门禁清单回归夹具
  cmd: python3 scripts/gate/test_gate_registry.py
  cwd: .
  timeout_sec: 300
- id: gov-probe-metrics
  name: 自指度量当期取值
  cmd: python3 scripts/gate/gov_probe.py metrics
  cwd: .
  timeout_sec: 900
