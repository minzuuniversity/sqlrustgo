commands:
- id: lb1-check-before-red
  name: 整改前夹具必须判红（缺维 43 处，判红条件仍在）
  cmd: bash -c 'python3 audit/v4.1.0/issue_labels.py check --input audit/v4.1.0/neg/snapshots/labelgap-open-before-20261105.jsonl
    --ledger docs/releases/v4.1.0/ISSUE_LABEL_LEDGER_v4.1.0.jsonl > /tmp/lb1-b.json; rc=$?; head -c 220
    /tmp/lb1-b.json; if [ $rc -eq 0 ]; then echo BEFORE-NOT-RED; exit 1; fi; echo BEFORE-RED-OK'
  cwd: .
  timeout_sec: 300
- id: lb1-check-after-green
  name: 整改后夹具必须判绿（不是永远红的摆设）
  cmd: python3 audit/v4.1.0/issue_labels.py check --input audit/v4.1.0/neg/snapshots/labelgap-open-after-20261105.jsonl
    --ledger docs/releases/v4.1.0/ISSUE_LABEL_LEDGER_v4.1.0.jsonl
  cwd: .
  timeout_sec: 300
- id: lb1-check-live
  name: live 三维 gap 必须为 0（112 个 open issue 都有 priority/cost/cap）
  cmd: python3 audit/v4.1.0/issue_labels.py check --input live --ledger docs/releases/v4.1.0/ISSUE_LABEL_LEDGER_v4.1.0.jsonl
  cwd: .
  timeout_sec: 300
- id: lb1-mutation-7arms
  name: 七臂反向变异：每臂都必须判别成立，否则核对器是摆设
  cmd: python3 audit/v4.1.0/issue_labels_mutations.py
  cwd: .
  timeout_sec: 300
- id: lb1-verify-live
  name: 只加不删的机器核对：lost_labels==0 且 added==expected_ops(43)
  cmd: python3 audit/v4.1.0/issue_labels.py verify audit/v4.1.0/neg/snapshots/labelgap-open-before-20261105.jsonl
    --ledger docs/releases/v4.1.0/ISSUE_LABEL_LEDGER_v4.1.0.jsonl
  cwd: .
  timeout_sec: 300
- id: lb1-plan-zero
  name: 稳态判据：live 上 plan 的 ops 必须为 0
  cmd: 'bash -c ''out=$(python3 audit/v4.1.0/issue_labels.py plan); echo "$out" | tail -2; echo "$out"
    | grep -qx "ops: 0" || { echo PLAN-OPS-NONZERO; exit 1; }; echo PLAN-ZERO-OK'''
  cwd: .
  timeout_sec: 300
- id: lb1-census-summary
  name: 标签 census：三维各覆盖全部 open issue，不得出现 (none) 键
  cmd: bash -c 'out=$(python3 scripts/gate/gov_probe.py issues 2>&1); echo "$out" | tail -1; if echo "$out"
    | grep -q "(none)"; then echo CENSUS-HAS-NONE-KEY; exit 1; fi; echo CENSUS-NO-NONE-KEY'
  cwd: .
  timeout_sec: 300
- id: lb1-doc-claims-clean
  name: 两份 4.1.0 报告不得出现 claims 字面量（与 gov_probe claim_re 同口径：PASS|全绿|✅）
  cmd: bash -c 'for f in docs/releases/v4.1.0/LB1_ISSUE_LABEL_TAXONOMY_2026-11-05.md docs/releases/v4.1.0/GEN1_KANBAN_ISSUE_GENERATOR_2026-11-05.md;
    do if grep -Eq "PASS|全绿|✅" "$f"; then echo CLAIMS-HIT $f; exit 1; fi; done; echo CLAIMS-CLEAN'
  cwd: .
  timeout_sec: 300
- id: gen1-selftest
  name: 看板 ISSUE 生成器四臂自检（含模板泄漏判据 A2）
  cmd: python3 audit/v4.1.0/gen_kanban_issue.py --selftest
  cwd: .
  timeout_sec: 300
- id: gen1-mutation-4arms
  name: 生成器四臂反向变异：必须全部翻红
  cmd: python3 audit/v4.1.0/gen_kanban_issue_mutations.py
  cwd: .
  timeout_sec: 300
- id: kanban-46-rows
  name: 看板渲染层与 SSOT 行数一致（46 行）
  cmd: bash -c 'python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
    | grep -q "46 rows"'
  cwd: .
  timeout_sec: 300
- id: kanban-issue-dryrun-no-patch
  name: 生成器默认只打印不 PATCH；行数口径与 SSOT 一致
  cmd: bash -c 'm=$(python3 scripts/gate/gov_probe.py metrics 2>/dev/null | tail -1); python3 audit/v4.1.0/gen_kanban_issue.py
    "$m" > /tmp/lb1-gen.md || { echo GEN-RC-NONZERO; exit 1; }; head -3 /tmp/lb1-gen.md; if ! grep -q
    "46 行" /tmp/lb1-gen.md; then echo ROWS-BAD; exit 1; fi; if grep -qi "patched:" /tmp/lb1-gen.md; then
    echo DRYRUN-DID-PATCH; exit 1; fi; echo DRYRUN-NO-PATCH-OK'
  cwd: .
  timeout_sec: 300
- id: gate-registry-check
  name: 门禁登记表核对（分母仍 168，本次未新增/删除门禁）
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 300
- id: gov-probe-metrics
  name: 度量快照（check_n / claims_hits / docs410 / audit_*）
  cmd: python3 scripts/gate/gov_probe.py metrics
  cwd: .
  timeout_sec: 300
