commands:
  - id: collect-soak-snapshot
    cmd: "for f in armA/metrics.csv armA/armA.log armA/server.log armA/driver.log heartbeat.jsonl soak.log; do ssh liying@192.168.0.252 \"cat /home/liying/soak-artifacts/20261116-168h-v410/attempt-20261116T230159Z/$f\"; done"
    desc: 从 252 取 168h SOAK 的时点快照（指标 / 臂 A 日志 / 服务端日志 / 驱动日志 / 心跳 / 监督日志）
    cwd: .
  - id: fsync-latency-probe
    cmd: "ssh liying@192.168.0.252 'python3 - <<PY  # 同盘新建文件，60 次 4096B write+fsync，逐次计时\nimport os, time, tempfile, statistics, json\nd = tempfile.mkdtemp(prefix='fsyncprobe-'); p = os.path.join(d, 'probe.bin')\nlat = []; fd = os.open(p, os.O_CREAT | os.O_WRONLY)\nfor i in range(60):\n    os.write(fd, b'x' * 4096); t0 = time.perf_counter(); os.fsync(fd)\n    lat.append((time.perf_counter() - t0) * 1000)\nos.close(fd); lat.sort()\npct = lambda p: round(lat[min(len(lat)-1, int(len(lat)*p))], 3)\nprint(json.dumps({'n': len(lat), 'p50_ms': pct(0.50), 'p90_ms': pct(0.90),\n  'p99_ms': pct(0.99), 'max_ms': round(max(lat), 3), 'min_ms': round(min(lat), 3),\n  'mean_ms': round(statistics.mean(lat), 3)}))\nPY"
    desc: 在 252 同盘实测 fsync 延迟分布（证明尾部秒级恶化 ⇒ 同盘被间歇性饿死）
    cwd: .
  - id: snapshot-facts
    cmd: python3 /tmp/_soak_facts.py
    desc: 从快照算出全部事实（错误率、峰值、冻结段、重新增长段、load 分布、错误形态）
    cwd: .
