notes:
- 本 run 是台账批的**中间态**记录（如实留档，不作为验收证据；权威 run 是 20261106-ledger-002）。
- 它跑在「台账按当期 open 全集重生（104 行）」+「工具口径尚未对齐」的中间状态上，3 条红各自有明确成因：
- 红 1：ledger-verify（exit=1）—— L1「行数 104 != 有分诊行的 issue 数 110」暴露了**范围混用**（台账范围 vs 分诊归档范围），并连带
  L2 报十几条「自报 advisory-only、现场应为 cross-checked」⇒ 根因是三个工具用了**不同的分诊文件集**（核对器 6 件、探针 4
  件、生成时我给了 4 件）。
- 红 2：ladder-health（exit=2）—— 工具语义是「不可裁定」（exit 2 = 不能裁定），实测 deepseek HTTP 500、其余 4
  席在 900s 上限内无 ok=true ⇒ 批量第二血统分诊当前跑不动（与 EX-10 一致）。
- 红 3：gate-main-freshness（exit=1）—— 结构性红（C-MAIN-02，GA 前 main 封存）。
- ⇒ 这三条红直接催生了本批的工具口径对齐（见 20261106-ledger-002 的 notes 与探针 probe_ledger_scope_mutations_omp.py）。
