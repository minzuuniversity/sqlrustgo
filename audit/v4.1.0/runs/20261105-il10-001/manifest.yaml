commands:
- id: il10-unit-tests
  name: IL-10 判据自证（真 CSV 不得误判 / 真 REPL 必须判出来）
  cwd: .
  timeout_sec: 1200
  cmd: 'cargo test --test a04_mysql_diff_matrix repl_transcript

    '
- id: il10-stale-binary
  name: 强制 2026-02-21 的陈旧全局 sqlrustgo ⇒ 必须转 NOT RUN 披露且不得报「证据漂移」
  cwd: .
  timeout_sec: 1800
  cmd: 'f="$(mktemp)"

    SQLRUSTGO_BIN=/Users/liying/.cargo/bin/sqlrustgo bash scripts/gate/check_a04_evidence_reproducible.sh
    >"$f" 2>&1

    rc=$?

    grep -E "MISMATCH|STATUS: NOT RUN|RESULT" "$f" || true

    echo "exit_code=$rc"

    echo "mismatch_lines=$(grep -c ''MISMATCH'' "$f")"

    echo "drift_claims=$(grep -c ''drifted'' "$f")"

    echo "not_verified=$(grep -c ''NOT VERIFIED'' "$f")"

    echo "not_verified_sqlrustgo_cli=$(grep ''NOT VERIFIED'' "$f" | grep -c ''sqlrustgo_cli'')"

    s=0

    [ "$rc" -eq 0 ] || s=1

    [ "$(grep -c ''MISMATCH'' "$f")" = "0" ] || s=1

    [ "$(grep -c ''drifted'' "$f")" = "0" ] || s=1

    [ "$(grep -c ''NOT VERIFIED'' "$f")" = "40" ] || s=1

    rm -f "$f"

    exit $s

    '
- id: il10-no-phantom-evidence
  name: 陈旧二进制下生成器必须不产出 sqlrustgo_cli 文件（引擎不可用 ⇒ 无证据）
  cwd: .
  timeout_sec: 1200
  cmd: 'rm -rf target/a04-5226

    SQLRUSTGO_BIN=/Users/liying/.cargo/bin/sqlrustgo cargo test --test a04_mysql_diff_matrix >/dev/null
    2>&1

    n=$(ls target/a04-5226/wire/ 2>/dev/null | grep -c ''sqlrustgo_cli'')

    echo "sqlrustgo_cli_files=$n"

    echo "other_engines=$(ls target/a04-5226/wire/ 2>/dev/null | grep -vc ''sqlrustgo_cli'')"

    [ "$n" -eq 0 ]

    '
- id: il10-normal-build
  name: 正常（当前构建）⇒ 仍 80/80 逐字节一致
  cwd: .
  timeout_sec: 1800
  cmd: 'f="$(mktemp)"

    bash scripts/gate/check_a04_evidence_reproducible.sh >"$f" 2>&1

    rc=$?

    grep -E "PASS:|RESULT|STATUS: NOT RUN" "$f" || true

    echo "exit_code=$rc"

    s=0

    [ "$rc" -eq 0 ] || s=1

    grep -q "80/80 comparable archived evidence file(s) match this run byte-for-byte" "$f" || s=1

    rm -f "$f"

    exit $s

    '
- id: a01-baseline
  name: A01 证据门禁仍应是那 7 条历史红（不得放宽）
  cwd: .
  timeout_sec: 600
  cmd: 'f="$(mktemp)"

    bash scripts/gate/check_audit_manifest.sh >"$f" 2>&1

    rc=$?

    grep "^FAIL:" "$f" || true

    n=$(grep -c "^FAIL:" "$f")

    echo "exit_code=$rc fail_count=$n"

    rm -f "$f"

    s=0

    [ "$rc" -eq 1 ] || s=1

    [ "$n" -eq 7 ] || s=1

    exit $s

    '
- id: claims-inventory-check
  name: P1-5 声明绑定判据：基线之上未绑定的新声明必须为 0
  cwd: .
  timeout_sec: 600
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" audit/v4.1.0/evidence_inventory.py check >"$f" 2>&1

    rc=$?

    cat "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    "$PY" -c "import json;d=json.loads(open(''$f'').read().strip().splitlines()[0]);assert d[''fails'']==0,
    d" || s=1

    rm -f "$f"

    exit $s

    '
- id: doc-facts-check
  name: P2-1 文档事实面：索引逐字节一致 + 两个既有门禁成立
  cwd: .
  timeout_sec: 1200
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" audit/v4.1.0/doc_facts.py check >"$f" 2>&1

    rc=$?

    cat "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    rm -f "$f"

    exit $s

    '
- id: gate-registry-check
  name: 门禁登记表不得漂移
  cwd: .
  timeout_sec: 600
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" scripts/gate/gate_registry.py check >"$f" 2>&1

    rc=$?

    cat "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    rm -f "$f"

    exit $s

    '
- id: kanban-rows
  name: 看板 SSOT 与渲染必须一致（54 行）
  cwd: .
  timeout_sec: 600
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md >"$f" 2>&1

    rc=$?

    cat "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    grep -q "54 rows" "$f" || s=1

    rm -f "$f"

    exit $s

    '
- id: gov-metrics
  name: 治理度量快照（check_n 必须仍为 168）
  cwd: .
  timeout_sec: 600
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    "$PY" scripts/gate/gov_probe.py metrics

    '
