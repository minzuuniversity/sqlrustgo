commands:
- id: lint1b5-clippy-inventory
  name: 批次 5 后复测 clippy 欠账分类计数（与批次 1/2/3 同一命令口径）。批次 4 归档 run 实测基线 111 条诊断行、目标类 very complex type 8 处 ⇒
    本批后该类应 0、总数应减 8、其余各类计数一字不变（预期以归档 run 实测为准）
  cmd: cargo clippy --workspace --all-features --all-targets --keep-going
  cwd: .
  timeout_sec: 5400
- id: lint1b5-mutation-fixture
  name: '计数判据的鉴别力夹具（基线该类 0 ⇒ 注入 8 元组 let …: Vec<(…)> 的反模式探针，计数必须回弹 ≥1 且点名注入文件 ⇒ 恢复后逐字节一致并回到 0）'
  cmd: python3 scripts/gate/test_lint1b5_mutation_fixtures.py
  cwd: .
  timeout_sec: 3000
- id: lint1b5-crash-server-build
  name: armed 构建第一步：带 fault-injection 的 server 二进制（崩溃套件按 <repo>/target/debug/sqlrustgo-mysql-server 找它；本
    run 的 target 是指向共享 target 的符号链接）
  cmd: cargo build -p sqlrustgo-mysql-server --all-features
  cwd: .
  timeout_sec: 3600
- id: lint1b5-touched-crates-tests
  name: 无行为变化证据：批次 5 改的是 bench crate 的 example（tpch_sf10_importer.rs 的类型别名与签名）⇒ 跑被改 crate 的全部测试；example
    目标的编译由 check-all-targets 臂覆盖，storage 侧回归由 crash 臂覆盖
  cmd: cargo test -p sqlrustgo-bench
  cwd: .
  timeout_sec: 5400
- id: lint1b5-crash-wal-index-armed
  name: 崩溃套件（armed）：与 touched-crates-tests 里的同一测试互为对照（一条走 dev-dependency 自动开 feature，一条显式 --features）
  cmd: cargo test -p sqlrustgo-storage --features fault-injection --test crash_wal_index_b1
  cwd: .
  timeout_sec: 3600
- id: lint1b5-check-all-targets
  name: 全 workspace 全目标编译校核（0 error；batch 5 改的是 example 内的类型别名与签名，check --all-targets 覆盖 example 目标）
  cmd: cargo check --workspace --all-targets --all-features
  cwd: .
  timeout_sec: 3600
- id: lint1b5-gate-anti-ignore
  name: '忽略台账（本批不新增 ignore：total_allowed 应仍 136 ≤ 150、ACTIVE 仍 82 ≤ 92，且与树内真实 #[ignore] 属性数一致）'
  cmd: bash scripts/gate/check_anti_ignore_gate.sh
  cwd: .
  timeout_sec: 900
- id: lint1b5-gate-registry
  name: 门禁登记表一致性（分母仍 168：新增夹具命名 test_lint1b5_mutation_fixtures.py，不占 check_*）
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 900
- id: lint1b5-gate-drift-not-pass
  name: DRIFT 门禁本体（前几批改后的判据不得回退）
  cmd: bash scripts/gate/check_drift_not_pass.sh
  cwd: .
  timeout_sec: 900
- id: lint1b5-gate-docs-pointer-paths
  name: 文档指针路径门禁（本批看板文字新增了一批反引号路径，不得引入断链）
  cmd: bash scripts/gate/check_docs_pointer_paths.sh
  cwd: .
  timeout_sec: 900
