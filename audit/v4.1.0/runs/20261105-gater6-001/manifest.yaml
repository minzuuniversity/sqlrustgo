  cwd: .
  timeout_sec: 900
  cmd: 'f="$(mktemp)"

    bash scripts/gate/check_correctness_tests_production_storage.sh >"$f" 2>&1

    rc=$?

    grep -E "\[PASS\]|\[FAIL\]|=== Result" "$f"

    echo "exit_code=$rc"

