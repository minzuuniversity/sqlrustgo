commands:
- id: stagecfg-gate-real
  name: 既有门禁 check_stage_config_consistency 对真实 SSOT 跑 C9（0 FAIL）
  cmd: bash scripts/gate/check_stage_config_consistency.sh
  cwd: .
  timeout_sec: 300
- id: stagecfg-gate-selftest-14arms
  name: 该门禁自带 selftest 由 8 臂扩到 14 臂（新增 6 条 C9 反向变异）
  cmd: bash scripts/gate/check_stage_config_consistency.sh --selftest
  cwd: .
  timeout_sec: 600
- id: stagecfg-probe-check
  name: 真实配置判据处置计数（21 = 7 gates + 14 manual）
  cmd: python3 audit/v4.1.0/probe_stage_criteria_disposal.py check
  cwd: .
  timeout_sec: 300
- id: stagecfg-probe-mutation-6arms
  name: 在真实配置副本上重造缺陷，六臂必须红
  cmd: python3 audit/v4.1.0/probe_stage_criteria_disposal.py mutation-selftest
  cwd: .
  timeout_sec: 600
- id: stagecfg-count-assert
  name: 度量断言 stage_crit=21 / stage_map=7 / stage_manual=14（此前 map=0）
  cmd: python3 -c "import json,subprocess,sys;o=json.loads(subprocess.run(['python3','scripts/gate/gov_probe.py','metrics'],capture_output=True,text=True).stdout);sys.exit(0
    if (o['stage_crit'],o['stage_map'],o['stage_manual'])==(21,7,14) else 1)"
  cwd: .
  timeout_sec: 900
- id: gate-registry-check
  name: 门禁清单只读核对（分母仍 168）
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 300
- id: gate-registry-fixtures
  name: 门禁登记夹具回归
  cmd: python3 scripts/gate/test_gate_registry.py
  cwd: .
  timeout_sec: 300
- id: kanban-43-rows
  name: 看板 SSOT 与渲染一致（43 行，含新增 SC-1）
  cmd: bash -c 'python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
    | grep -q "43 rows"'
  cwd: .
  timeout_sec: 120
- id: ciroots-check-regression
  name: P0-5 执行点台账回归
  cmd: python3 audit/v4.1.0/probe_ci_roots.py check
  cwd: .
  timeout_sec: 300
- id: gov-probe-metrics
  name: 治理度量重放（本轮新增探针与 SSOT 文本会抬高自指计数）
  cmd: python3 scripts/gate/gov_probe.py metrics
  cwd: .
  timeout_sec: 900
notes:
- 本 run 不含 ci_gate.sh，不构成门禁 PASS 声明。
- P1-1（阶段判据必须指明执行者）证据 run：C9 是**既有**门禁 check_stage_config_consistency.sh 上新增的规则，门禁清单/阈值/跳过开关未动，分母仍 168（gate-registry-check
  在同一 run 里回归）。
- 可证伪性有两处：门禁自带 selftest 现 14 臂（合成样本，c9a..c9f 必须红且命中 C9）；本 run 的 probe mutation 在真实 STAGE_CONFIG.yaml 的副本上重造缺陷（六臂
  rc=1，C9 命中数 21/1/1/2/1/1）。
- SSOT 现在 stage_crit=21 / stage_map=7 / stage_manual=14。7 条绑定既有门禁，14 条记为仅人工判定；其中 6 条是缺口（open-issue、open-P0、tag
  前置、B-F 判据文本仍指向 v3.8.0、blocker 关闭、合 main），补门禁属门禁清单变更，只能 owner 决定。
- '看板 P1-1 记 待复核 而非完成：C9 目前只有本地执行证据，CI 侧被 IL-9（runner-03 缺镜像，PR #5593 的 Actions job 未进入执行）挡住。'
- 本轮另登记 SC-1：不带 --version 的 check_stage.sh 会评到已归档发布线并把日志写进该发布目录；误触发的日志已删除、未提交（该路径被 .gitignore 反向规则放行，属真实污染风险）。
- 自指提醒：本 run 新增探针与 SSOT 文本会改变 audit_manifests / docs410 一类自指度量，取值以本 run 的 gov-probe-metrics 日志为准。
