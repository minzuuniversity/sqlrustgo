commands:
- id: prereq-binaries
  name: 前置：被测二进制与备份工具必须存在（probe/capability 都按 target/debug 找）
  cmd: 'set -e

    test -x target/debug/sqlrustgo-mysql-server

    test -x target/debug/physical-backup

    shasum -a 256 target/debug/sqlrustgo-mysql-server

    '
  cwd: .
  timeout_sec: 300
- id: test-bin1-storage
  name: '#5601 存储层回归：binary 的四条 DDL 必须报错（5 条）'
  cmd: cargo test -q -p sqlrustgo-storage --all-features --test binary_storage_ddl_honesty_5601
  cwd: .
  timeout_sec: 1800
- id: test-bin1-wire
  name: '#5601 wire 层回归：真 client + 真 binary 后端，CREATE DATABASE / CREATE TRIGGER 必须返回 ERROR（2 条）'
  cmd: cargo test -q -p sqlrustgo-mysql-server --all-features --test binary_storage_ddl_honesty_5601
  cwd: .
  timeout_sec: 1800
- id: binmode-probe
  name: 取证探针：binary 模式的假成功必须归零（false_success_count 必须 0）
  cmd: 'set -euo pipefail

    mkdir -p test_results/binmode

    python3.14 audit/v4.1.0/binmode_probe.py --out test_results/binmode --server-bin target/debug/sqlrustgo-mysql-server
    2>&1 | tee test_results/binmode/probe.json

    '
  cwd: .
  timeout_sec: 1200
- id: binmode-lock
  name: 锁值核对：#5601 的判定面必须与「已修」一致（缺陷回归即报红）
  cmd: python3.14 audit/v4.1.0/binmode_lock.py --json test_results/binmode/probe.json
  cwd: .
  timeout_sec: 300
- id: cap-live-prod
  name: 判别力：真 CLI + 真 mysql 客户端 + 真落库 + 崩溃读回 + 备份恢复；生产链 findings=0 且非生产判别臂必须变红
  cmd: python3.14 audit/v4.1.0/capability_smoke.py run --out test_results/capability_smoke/run-bin1-001
  cwd: .
  timeout_sec: 1800
- id: cap-live-summary
  name: 把上一命令的 json 摊成可核对结论
  cmd: python3.14 audit/v4.1.0/cap_live_summary.py --json test_results/capability_smoke/run-bin1-001/capability_smoke.json
