commands:
- id: test-f08-column-lookup
  name: F-08：UnifiedExpr::Column 的大小写不敏感列查找（新增单测 + 整个 executor 单测集）
  cmd: cargo test -q -p sqlrustgo-executor --all-features --lib
  cwd: .
  timeout_sec: 2400
- id: test-parallel-main-path
  name: 并行主路径集成测试（develop 侧的『按阈值触发』形态必须仍绿）
  cmd: cargo test -q --test parallel_main_path_test
  cwd: .
  timeout_sec: 1800
- id: gate-anti-fabrication
  name: anti-fabrication 门禁本体（改动它的前提是本批新增的自检脚本在位）
  cmd: bash scripts/gate/check_anti_fabrication.sh
  cwd: .
  timeout_sec: 3600
- id: probe-anti-fabrication-selftest
  name: anti-fabrication 三态自检（PASS ⇒ rc=0）
  cmd: bash scripts/gate/selftest_anti_fabrication.sh
  cwd: .
  timeout_sec: 600
- id: probe-anti-fabrication-selftest-negative
  name: 同一自检的反向变异：--negative 注入缺陷 ⇒ 必须报『检出注入的缺陷』（rc=0 且输出含 detected）
  cmd: 'out="$(bash scripts/gate/selftest_anti_fabrication.sh --negative 2>&1)"

    rc=$?

    echo "$out" | tail -3

    [ "$rc" -eq 0 ] || exit 1

    echo "$out" | grep -q "injected defect was detected"

    '
  cwd: .
  timeout_sec: 600
- id: gate-honesty-check
  name: honesty 判据（分母 168、夹具 57、fails 必须 0）
