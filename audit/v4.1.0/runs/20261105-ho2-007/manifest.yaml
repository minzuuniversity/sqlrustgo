commands:
- id: ho2-kanban-consistency
  name: 看板 SSOT 与渲染一致 + 状态计数断言（48：9/17/13/9）
  cmd: bash -c 'python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
    | tail -1 && grep -q "未开始 9 / 待复核 17 / 完成 13 / 阻塞 9 / 合计 48" docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md'
  cwd: .
  timeout_sec: 300
- id: ho2-metrics-print
  name: 度量现值留证（gov_probe metrics 摘要）
  cmd: bash -c 'python3 scripts/gate/gov_probe.py metrics | tail -1 | head -c 320; echo'
  cwd: .
  timeout_sec: 300
- id: ho2-metrics-baseline
  name: 度量基线断言：分母 168 / claims_hits 1144 / docs410 80（新增 HO2 规则文档后 79 变 80）
  cmd: 'python3 scripts/gate/gov_probe.py metrics | tail -1 > /tmp/ho2-metrics.json && grep -q ''"check_n":
    168'' /tmp/ho2-metrics.json && grep -q ''"claims_hits": 1144'' /tmp/ho2-metrics.json && grep -q ''"docs410":
    80'' /tmp/ho2-metrics.json && echo METRICS-BASELINE-OK'
  cwd: .
  timeout_sec: 300
- id: ho2-generator-selftest
  name: 看板生成器自检（六臂 A1-A6）
  cmd: bash -c 'python3 audit/v4.1.0/gen_kanban_issue.py --selftest | tail -1 | grep -qx "selftest arms=6
    failures=0"'
  cwd: .
  timeout_sec: 300
- id: ho2-generator-mutations
  name: 看板生成器反向变异（五臂，撤掉判据必变绿）
  cmd: bash -c 'python3 audit/v4.1.0/gen_kanban_issue_mutations.py | tail -1 | grep -qx "arms=5 flipped_red=5
    stayed_green=0 drift=0"'
  cwd: .
  timeout_sec: 600
- id: ho2-appendix-guard-missing-file
  name: 生成器 --appendix 缺文件必须 fail-closed（非零退出）
  cmd: bash -c 'python3 audit/v4.1.0/gen_kanban_issue.py --appendix does-not-exist.md > /tmp/ho2-guard.txt
    2>&1; rc=$?; echo rc=$rc; cat /tmp/ho2-guard.txt | head -2; test $rc -ne 0'
  cwd: .
  timeout_sec: 300
- id: ho2-appendix-check-live-green
  name: 发布完整性判据（线上
  cmd: bash -c 'python3 audit/v4.1.0/board_appendix_check.py'
  cwd: .
  timeout_sec: 300
- id: ho2-appendix-mutations-6arms
  name: 发布完整性反向变异六臂（含末尾改动臂 + 交接 ISSUE 过期臂）
  cmd: bash -c 'python3 audit/v4.1.0/board_appendix_check_mutations.py | tail -1 | grep -qx "arms=6 discriminating=6
    not_discriminating=0 drift=0"'
  cwd: .
  timeout_sec: 900
- id: ho2-board-issue-live-ho3
  name: 线上看板
  cmd: python3 -c 'import sys;sys.path.insert(0,"audit/v4.1.0");import board_appendix_check as b;body=b.get_body(b.BASE,"5592");print("board_len=%d
    HO-3=%s rows48=%s" % (len(body),"HO-3" in body,"48 行" in body));sys.exit(0 if ("HO-3" in body and
    "48 行" in body) else 1)'
  cwd: .
  timeout_sec: 300
- id: ho2-old-fixture-worktree-add
  name: 建 39fa9887ff 的 scratch 检出（复现旧夹具用的判据）
  cmd: git worktree add --detach /private/tmp/ho2-old 39fa9887ff
  cwd: .
  timeout_sec: 300
- id: ho2-old-fixture-regression-4of5
  name: 在 39fa9887ff 上重跑旧 harness ⇒ 只有 4/5，m3 显示 NOT-DISC（夹具写死 17905，真实 18818）
  cmd: cd /private/tmp/ho2-old && python3 audit/v4.1.0/board_appendix_check_mutations.py > /tmp/ho2-old-mut.log
    2>&1; rc=$?; tail -4 /tmp/ho2-old-mut.log; if [ $rc -eq 1 ] && grep -q "NOT-DISC m3-byte-metric-drift"
    /tmp/ho2-old-mut.log && grep -qx "arms=5 discriminating=4 not_discriminating=1 drift=0" /tmp/ho2-old-mut.log;
    then echo OLD-FIXTURE-REGRESSION-CONFIRMED; else echo REGRESSION-NOT-REPRODUCED; exit 1; fi
  cwd: .
  timeout_sec: 900
- id: ho2-old-fixture-worktree-remove
  name: 回收 39fa9887ff 的 scratch 检出
  cmd: git worktree remove --force /private/tmp/ho2-old
  cwd: .
  timeout_sec: 300
- id: ho2-new-docs-claims-clean
  name: 本轮新增文档不得出现 PASS / 全绿 / ✅（docs/releases/v4.1.0 是 claims 扫描区）
  cmd: grep -Ec "PASS|全绿|✅" docs/releases/v4.1.0/HO2_APPENDIX_RULES_2026-11-05.md docs/knowledge-loop/handoffs/HANDOFF_2026-11-05_4.1.0_OMP_ONBOARDING.md
    | grep -v ":0$" | wc -l | grep -qx 0 && echo CLAIMS-CLEAN
  cwd: .
  timeout_sec: 300
- id: ho2-label-census-live
  name: 标签三维 live 复查（open_total=112，per_dim 全 0，findings=0）
  cmd: 'python3 audit/v4.1.0/issue_labels.py check --input live --ledger docs/releases/v4.1.0/ISSUE_LABEL_LEDGER_v4.1.0.jsonl
    > /tmp/ho2-labels.json; rc=$?; tail -1 /tmp/ho2-labels.json; if [ $rc -eq 0 ] && grep -q ''"findings":
    0'' /tmp/ho2-labels.json && grep -q ''"unledgered": 0'' /tmp/ho2-labels.json; then echo LABEL-CENSUS-OK;
    else echo LABEL-CENSUS-NOT-AS-CLAIMED; exit 1; fi'
  cwd: .
  timeout_sec: 600
- id: ho2-gate-registry-check
  name: 门禁注册表核对（分母 168 未变）
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 300
- id: ho2-audit-gate-selfref-this-line
  name: 证据门禁在本线实跑（FAIL 走 stderr；在飞 run 会被自指多算 1 条 = IL-6 治的问题）
  cmd: bash scripts/gate/check_audit_manifest.sh > /tmp/ho2-gate.out 2>/tmp/ho2-gate.err; rc=$?; reds=$(grep
    -c "^FAIL" /tmp/ho2-gate.err); echo "rc=$rc reds=$reds"; grep "^FAIL" /tmp/ho2-gate.err | head -8;
    grep -c "20261105-ho2-007" /tmp/ho2-gate.err | sed "s/^/selfref_hits=/"; if [ $rc -ne 0 ] && [ $reds
    -ge 7 ]; then echo AUDIT-GATE-RED-AS-EXPECTED; else echo AUDIT-GATE-NOT-AS-EXPECTED; exit 1; fi
  cwd: .
  timeout_sec: 900
- id: ho2-divergence-evidence
  name: 两条线分叉证据（merge-base c1a5b0ba9d；同名 run 两份 manifest 的两个 evidence_hash 都在）
  cmd: git merge-base 8db1a61ceb 7079b83238 | grep -q "^c1a5b0ba9d" && echo MERGE-BASE-OK && git show
    8db1a61ceb:audit/v4.1.0/runs/20261105-lb1-006/manifest.yaml | grep -m1 evidence_hash && git show 7079b83238:audit/v4.1.0/runs/20261105-lb1-006/manifest.yaml
    | grep -m1 evidence_hash && git show 8db1a61ceb:audit/v4.1.0/runs/20261105-lb1-006/manifest.yaml |
    grep -q 74a3d0c5 && git show 7079b83238:audit/v4.1.0/runs/20261105-lb1-006/manifest.yaml | grep -q
    9ec3c10d && echo DIVERGENCE-EVIDENCE-OK
  cwd: .
  timeout_sec: 300
- id: ho2-il6-worktree-add
  name: 建 omp 线 tip（7079b83238）的 scratch 检出
  cmd: git worktree add --detach /private/tmp/ho2-il6v 7079b83238
  cwd: .
  timeout_sec: 300
- id: ho2-il6-probe-in-omp-tree
  name: 在 omp 树里独立跑它的 IL-6 自指探针（checks=4 ok=4）
  cmd: cd /private/tmp/ho2-il6v && python3 audit/v4.1.0/il6_selfref_probe.py | tail -1 | grep -qx "checks=4
    ok=4 not_ok=0 drift=0" && echo IL6-PROBE-OK
  cwd: .
  timeout_sec: 600
- id: ho2-il6-gate-in-omp-tree
  name: 同一证据门禁在 omp 树里 FAIL 恰为 7 条（与本线的自指红数形成判别对比）
  cmd: cd /private/tmp/ho2-il6v && bash scripts/gate/check_audit_manifest.sh > /tmp/ho2-il6.out 2>/tmp/ho2-il6.err;
    rc=$?; reds=$(grep -c "^FAIL" /tmp/ho2-il6.err); echo "rc=$rc reds=$reds"; if [ $rc -ne 0 ] && [ $reds
    -eq 7 ]; then echo IL6-GATE-7-FAILS-AS-CLAIMED; else echo IL6-GATE-MISMATCH; exit 1; fi
  cwd: .
  timeout_sec: 900
- id: ho2-il6-worktree-remove
  name: 回收 omp 线 scratch 检出
  cmd: git worktree remove --force /private/tmp/ho2-il6v
  cwd: .
  timeout_sec: 300
- id: ho2-worktree-clean-after
  name: 收尾：不得残留 /private/tmp 下的 scratch 检出
  cmd: git worktree list; if git worktree list | grep -q "/private/tmp"; then echo LEFTOVER-WORKTREES;
    exit 1; else echo WORKTREE-CLEAN-OK; fi
  cwd: .
  timeout_sec: 300
