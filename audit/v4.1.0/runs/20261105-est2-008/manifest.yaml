commands:
- id: est2-census-print
  name: 留证：live issue 普查摘要（open_total 与 cost 标签分布）
  cmd: python3 scripts/gate/gov_probe.py issues | tail -1 > /tmp/est2-census.json && cat /tmp/est2-census.json
  cwd: .
  timeout_sec: 300
- id: est2-census-baseline
  name: census 断言：open_total=112 且 cost 标签 t0=24/t1=65/t2=23（估算的分母来源）
  cmd: 'grep -q ''"open_total": 112'' /tmp/est2-census.json && grep -q ''"cost/t0": 24'' /tmp/est2-census.json
    && grep -q ''"cost/t1": 65'' /tmp/est2-census.json && grep -q ''"cost/t2": 23'' /tmp/est2-census.json
    && echo CENSUS-BASELINE-OK'
  cwd: .
  timeout_sec: 300
- id: est2-seat-chatgpt
  name: 席位读数（lineage gpt / chatgpt-web）：用仓内 est prompt 现场重跑，读数会漂移
  cmd: python3 scripts/gate/expert_ladder.py ask --seat chatgpt-web --question - --max-tokens 350 --timeout
    240 < audit/v4.1.0/est_prompt_2026-11-05.txt
  cwd: .
  timeout_sec: 280
- id: est2-seat-flash
  name: 席位读数（lineage qwen / flash-next-252 @252:8001）：同上
  cmd: python3 scripts/gate/expert_ladder.py ask --seat flash-next-252 --question - --max-tokens 600 --timeout
    240 < audit/v4.1.0/est_prompt_2026-11-05.txt
  cwd: .
  timeout_sec: 280
- id: est2-seat-deepseek-abstain
  name: 弃权现场必须仍在：deepseek-chat（EX-5 需人工登录）必须 fail-closed，不得被算作背书（R2）
  cmd: 'python3 scripts/gate/expert_ladder.py ask --seat deepseek-chat --question - --timeout 60 < audit/v4.1.0/est_prompt_2026-11-05.txt
    > /tmp/est2-ds.json; rc=$?; if [ $rc -ne 0 ] && grep -q ''"ok": false'' /tmp/est2-ds.json; then echo
    ABSTAIN-RECORDED deepseek-chat-exit=$rc; else echo MISMATCH-expect-abstain-rc=$rc; head -c 300 /tmp/est2-ds.json;
    exit 1; fi'
  cwd: .
  timeout_sec: 200
- id: est2-recompute-bind
  name: 文档↔事实绑定：估算文档里的每个派生数必须等于现算值，且本次席位读数不得整段偏离声称并集
  cmd: python3 audit/v4.1.0/est_recompute.py --plan docs/releases/v4.1.0/GOVERNANCE_REMEDIATION_PLAN_2026-11-04.md
    --doc docs/releases/v4.1.0/ESTIMATE_DOUBLE_LINEAGE_2026-11-05.md --require-run-id 20261105-est2-008
    --fresh-read audit/v4.1.0/runs/20261105-est2-008/logs/003-est2-seat-chatgpt.stdout --fresh-read audit/v4.1.0/runs/20261105-est2-008/logs/004-est2-seat-flash.stdout
    < /tmp/est2-census.json
  cwd: .
  timeout_sec: 300
- id: est2-recompute-mutations
  name: 反向变异：12 臂必须全部承重，2 条正臂（未变异基线 / 并集内读数）必须保持不红
  cmd: python3 audit/v4.1.0/est_recompute_mutations.py | tail -1 | grep -qx 'arms=12 flipped_red=12 stayed_green=0
    drift=0 positive_fail=0'
  cwd: .
  timeout_sec: 300
- id: est2-denominator-168
  name: 门禁分母不变式：check_n 仍为 168（本轮只加判定工具，未新增门禁）
  cmd: 'python3 scripts/gate/gov_probe.py metrics | tail -1 | grep -q ''"check_n": 168'' && echo DENOM-168-OK'
  cwd: .
  timeout_sec: 300
- id: est2-metrics-record
  name: 度量现值留证（本 run 自指：audit_manifests 会把在飞 run 自己算进去，见 notes）
  cmd: python3 scripts/gate/gov_probe.py metrics | tail -1 | head -c 400; echo
  cwd: .
  timeout_sec: 300
- id: est2-kanban-consistency
  name: 看板 SSOT 与渲染一致 + 状态计数断言（50：9/18/14/9）
  cmd: python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md | tail
    -1 && grep -q '未开始 9 / 待复核 18 / 完成 14 / 阻塞 9 / 合计 50' docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
  cwd: .
  timeout_sec: 300
- id: est2-new-tools-compile
  name: 新增两工具必须能编译（语法级）
  cmd: python3 -m py_compile audit/v4.1.0/est_recompute.py audit/v4.1.0/est_recompute_mutations.py &&
    echo COMPILE-OK
  cwd: .
  timeout_sec: 300
- id: est2-est-doc-claims-clean
  name: 估算文档必须不含被禁声明串（与 gov_probe 同一正则：PASS/全绿/绿色对勾）
  cmd: python3 -c 'import re,sys,io; t=io.open("docs/releases/v4.1.0/ESTIMATE_DOUBLE_LINEAGE_2026-11-05.md",encoding="utf-8").read();
    n=len(re.findall(r"PASS|全绿|\u2705", t)); print("hits", n); sys.exit(0 if n==0 else 1)'
  cwd: .
  timeout_sec: 300
- id: est2-plan-pointer
  name: 计划文档 §9.3 勘误指针必须仍在，且指名本 run
  cmd: grep -q 'ESTIMATE_DOUBLE_LINEAGE_2026-11-05.md' docs/releases/v4.1.0/GOVERNANCE_REMEDIATION_PLAN_2026-11-04.md
    && grep -q '20261105-est2-008' docs/releases/v4.1.0/GOVERNANCE_REMEDIATION_PLAN_2026-11-04.md && grep
    -q '20–48 周' docs/releases/v4.1.0/GOVERNANCE_REMEDIATION_PLAN_2026-11-04.md && echo POINTER-OK
  cwd: .
  timeout_sec: 300
- id: est2-prompt-fingerprint
  name: 席位 prompt 指纹不变（换 prompt 即换读数口径）
  cmd: shasum -a 256 audit/v4.1.0/est_prompt_2026-11-05.txt | grep -q '^f77c82400a00d23b8333ed9dc0390d1acbeb09be88a7ae142ab6771548948489'
    && echo PROMPT-HASH-OK
  cwd: .
  timeout_sec: 300
- id: est2-claims-baseline
  name: 声明命中基线：claims_hits=1144 / claims_files=11 / docs410=81（本轮新增 0 处未绑定声明）
  cmd: 'python3 scripts/gate/gov_probe.py metrics | tail -1 | grep -q ''"claims_hits": 1144'' && python3
    scripts/gate/gov_probe.py metrics | tail -1 | grep -q ''"claims_files": 11'' && python3 scripts/gate/gov_probe.py
    metrics | tail -1 | grep -q ''"docs410": 81'' && echo CLAIMS-BASELINE-OK'
  cwd: .
  timeout_sec: 300
- id: est2-board-appendix
  name: 看板 ISSUE
  cmd: python3 audit/v4.1.0/board_appendix_check.py | tail -1
  cwd: .
  timeout_sec: 300
- id: est2-issue-labels
  name: issue 标签台账核对（live）：findings=0 且 unledgered=0
  cmd: python3 audit/v4.1.0/issue_labels.py check --input live --ledger docs/releases/v4.1.0/ISSUE_LABEL_LEDGER_v4.1.0.jsonl
    | tail -1
  cwd: .
  timeout_sec: 300
