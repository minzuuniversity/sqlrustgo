notes:
- |
  本 run 共 17 条命令：16 条 exit 0、1 条 exit 1（est2-recompute-bind，见第 3 条，保留未洗绿）。本 run 不含 ci_gate.sh、不含 168 道门禁全量实跑、不含 cargo test ⇒ 不构成任何「门禁通过」声明。
- |
  冻结口径：frozen_commit=d04918ecfa（该提交含 est_recompute.py、est_recompute_mutations.py、EST 文档日历周订正、看板 EST-2 行）。自指披露：在飞 run 会被 check_audit_manifest.sh 与 gov_probe 的 audit_manifests 计数算进自己 ⇒ 本 run 入库后 audit_manifests 28→29、audit_manifests_runs 22→23，引用前必须复算。
- |
  est2-recompute-bind 红（FAIL 保留）根因：chatgpt-web 席位返回 ok=true、finish_reason=stop，但 content 只有「无法加载此回复」9 个字（latency 58.77s）—— 这是 ChatGPT 网页桥的占位错误文案。est_recompute 因此判 fresh-read-no-interval 并退 1，即绑定判据 fail-closed 生效。真正的缺陷在席位层：桥把「这一轮没能取到回复」当成功返回，血统计数会被虚增。已登记为看板行 EX-7（席位读数必须校验内容，占位/空文案必须 ok=false）。
- |
  同 run 的 qwen 席位有效（log 004）：flash-next-252 ⇒ 140–180 人日 / 6–8 周，落在文档声称并集 111–300 内 ⇒ 不判文档过期；但它再次给出不自洽周数（140–180 人日不可能 6–8 周），EX-6 的 3/4 标定继续对它降权。
- |
  LLM 读数不可复算：本 run 的 gpt 系读数缺失 ⇒ 该 run 内只有 qwen 单系有效读数。按席位梯 R1（≥2 个不同 lineage 有效读数才可裁定）与 R2（弃权不得充当背书），EST-1 维持「待复核」，不得因为文档已写了 160–300/180–240 就当作两血统成立。
- |
  反向变异（log 007）arms=12 flipped_red=12 stayed_green=0 drift=0，两条正臂（未变异基线、并集内读数）保持不红；变异只作用于临时目录副本，仓内文件未改。首跑时 12 臂全部未红 ⇒ 查出 est_recompute.py 的 main() 未 sys.exit、退出码恒 0（判据本身永不红），已在 d04918ecfa 修掉 —— 这条是「反向变异把自证工具本身救回来」的现场证据。
