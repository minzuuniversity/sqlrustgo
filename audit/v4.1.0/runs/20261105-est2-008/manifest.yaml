  看板现值（log 010）：50 行，未开始 9 / 待复核 18 / 完成 14 / 阻塞 9；门禁分母不变式 check_n=168（log 008）；claims_hits=1144 / claims_files=11 / docs410=81（log 015）；估算文档自身不含被禁声明串（log 012 hits 0）。
