notes: |
  2 条命令：**clippy 复测绿**、**测试 1 失败**（该失败是**既有的 IDX-1 产品缺陷**，与本批无关 —— 已在**不含本批**的基线树上复现同样失败）。
  ① `lint1-batch1-clippy-count`（rc=0）：`cargo clippy --workspace --all-features --all-targets` 复测
     ⇒ `variable does not need to be mutable` 这一类**已清零**（基线 47）；其余各类计数见 stdout 的分类输出。
     注：总数由基线 280 降到 209，差 71 而非 47 ⇒ 差额来自基线是在**合并 develop 之前**测的，
     对照口径必须**同一树状态**才有意义（这一点已在本行 evidence 里写明）。
  ② `lint1-batch1-touched-crates-tests`（rc=101）：`cargo test -p sqlrustgo-executor -p sqlrustgo-storage`
     ⇒ 绝大多数通过，**唯一失败** `index_update_crash_does_not_serve_dangling_rows`
     （`crates/storage/tests/crash_wal_index_b1.rs:231` ⇒ `ERROR 1146 (42000) at line 1: Table not found: t`）。
     **该失败是既有的 IDX-1 产品缺陷**（`CREATE INDEX` 只认默认库 ⇒ 崩溃套件的种子在建索引那步就断），
     **与本批无关**：在**不含本批改动**的基线工作树（develop tip）上跑同一条用例 ⇒ **同样失败、同样报错**。
     ⇒ 本批自身的测试为绿；该红项按 IDX-1 单独跟踪。
  **一处必要的环境修正**：归档工作树必须把 `target` 指向共享 `CARGO_TARGET_DIR`（软链），否则
  `crates/storage/tests/fault_coordination.rs` 会按仓根相对路径找不到 `target/debug/sqlrustgo-mysql-server`
  ⇒ 崩溃用例报「server binary not found」；同理 `check_anti_fabrication.sh` 会报「target/release/sqlancer not built」。
  ⇒ **这是今天三个假红的共同根因之一**（ALPHA 的 coverage 29.72%、GA 的 AFP sqlancer、崩溃用例找不到 server）。
