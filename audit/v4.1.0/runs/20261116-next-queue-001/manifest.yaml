- id: nf1-5598-fail-open-unchanged
  name: '#5598 两处 fail-open 现状取证：architecture_freeze 末尾仍 exit 0；int_debt 判定仍只看 ACTIVE_COUNT/DEFERRED_WITHOUT_PLAN
    ⇒ 验收判据要求 owner 先定语义'
  cmd: 'echo "--- check_architecture_freeze.sh 末尾 ---"

    tail -12 scripts/gate/check_architecture_freeze.sh

    echo "--- check_int_debt.sh 判定段 ---"

    grep -n "FAILED_ITEMS\|ACTIVE_COUNT\|DEFERRED_WITHOUT_PLAN\|exit " scripts/gate/check_int_debt.sh
    | head -25

    '
  cwd: .
  timeout_sec: 300
