- id: det1-5702-claims-selftest
  name: '#5702 实测：claims_selftest 17 臂中 3 臂不符（P1-5/M2、P1-5/M4、P2-1/M4）⇒ 退出码必须非 0（该尺当前判红）'
  cmd: 'timeout 300 python3 audit/v4.1.0/claims_selftest.py

    '
  cwd: .
  timeout_sec: 600
- id: det1-5702-baseline-leak-p1-5
  name: '#5702 反向夹具臂：P1-5/M1（夹具带未绑定声明 ⇒ 期望红）与 P1-5/M2（夹具带已绑定声明 ⇒ 期望绿）分别实跑 ⇒ M1 的红必须来自夹具自身而非无关文件；基线本身已红
    ⇒ M2 必然红'
  cmd: "python3 - <<'PY'\nimport subprocess, sys\nfrom pathlib import Path\nREPO = Path(\".\").resolve()\n\
    scratch = REPO / \"docs\" / \"releases\" / \"v4.1.0\" / \"ZZ_claims_selftest_scratch.md\"\ndef run(script,\
    \ *args):\n    p = subprocess.run([sys.executable, str(REPO / \"audit\" / \"v4.1.0\" / script), *args],\n\
    \                       cwd=str(REPO), capture_output=True, text=True, timeout=900)\n    return p.returncode,\
    \ (p.stdout + p.stderr)\nscratch.write_text(\"# selftest scratch\\n\\n本模块测试 PASS。\\n\", encoding=\"\
    utf-8\")\ntry:\n    rc, o = run(\"evidence_inventory_ledger_omp.py\", \"check\")\n    print(\"M1 未绑定声明\
    \ rc=\", rc)\n    print(\"  夹具自身是否被点名:\", \"ZZ_claims_selftest_scratch\" in o)\nfinally:\n    scratch.unlink(missing_ok=True)\n\
    scratch.write_text(\"# selftest scratch\\n\\n见 run 20261105-lb1-006，本模块测试 PASS。\\n\", encoding=\"\
    utf-8\")\ntry:\n    rc, o = run(\"evidence_inventory_ledger_omp.py\", \"check\")\n    print(\"M2 已绑定声明\
    \ rc=\", rc, \"(期望 0)\")\n    print(\"  夹具自身是否被点名:\", \"ZZ_claims_selftest_scratch\" in o)\nfinally:\n\
    \    scratch.unlink(missing_ok=True)\nrc, o = run(\"evidence_inventory_ledger_omp.py\", \"check\"\
    )\nprint(\"基线 check rc=\", rc, \"(基线是否已红)\")\nfor line in o.splitlines():\n    if line.startswith(\"\
    FAIL:\"):\n        print(\"  \", line[:160])\nPY\n"
  cwd: .
  timeout_sec: 900
- id: det1-5702-lb1-arm-count
