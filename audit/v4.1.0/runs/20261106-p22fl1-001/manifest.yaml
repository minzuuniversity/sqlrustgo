  cmd: "set -u\nmkdir -p test_results/fl1\nok=0; bad=0\nfor i in $(seq 1 10); do\n  if cargo test -q -p\
    \ sqlrustgo-mysql-server --all-features --test file_storage_leading_column_collapse_5392 \\\n    \
    \   >\"test_results/fl1/run_$i.log\" 2>&1; then\n    ok=$((ok+1))\n  else\n    bad=$((bad+1))\n  \
    \  echo \"run $i RED —— 失败输出保留在 test_results/fl1/run_$i.log\"\n    tail -40 \"test_results/fl1/run_$i.log\"\
    \n  fi\ndone\necho \"连续 10 次：绿 $ok / 红 $bad\"\n[ \"$bad\" -eq 0 ]\n"
  cwd: .
  timeout_sec: 3600
