- id: ledger-grades
  name: IL-2 台账分级：graded_crosschecked 必须 >= 47 且这些行 triage_families >= 2
  cwd: .
  timeout_sec: 600
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" scripts/gate/issue_ledger.py --issues docs/releases/v4.1.0/ISSUE_SNAPSHOT_2026-11-05.jsonl --triage
    docs/releases/v4.1.0/ISSUE_TRIAGE_2026-11-05.jsonl docs/releases/v4.1.0/ISSUE_TRIAGE_2026-11-05B.jsonl
    docs/releases/v4.1.0/ISSUE_TRIAGE_CROSSCHECK_2026-11-05.jsonl docs/releases/v4.1.0/ISSUE_TRIAGE_CROSSCHECK_2026-11-05B.jsonl
    docs/releases/v4.1.0/ISSUE_TRIAGE_CROSSCHECK_2026-11-05C.jsonl docs/releases/v4.1.0/ISSUE_TRIAGE_CROSSCHECK_2026-11-05D.jsonl
    --credited-lineages gpt,qwen --out-jsonl "$f" --out-md /tmp/il2-ledger.md >/dev/null 2>&1

    rc=$?

    s=0

    [ "$rc" -eq 0 ] || s=1

    "$PY" -c "import json,collections;rows=[json.loads(l) for l in open(''$f'') if l.strip()];g=collections.Counter(r[''evidence_grade'']
    for r in rows);cc=[r for r in rows if r[''evidence_grade'']==''cross-checked''];bad=[r[''number'']
    for r in cc if len(r.get(''triage_families'') or [])<2];p0=[r for r in rows if r.get(''priority'')==''priority/p0''];print(json.dumps({''rows'':len(rows),''grades'':dict(g),''cross_checked'':len(cc),''cross_checked_without_2_families'':bad,''p0_rows'':len(p0),''p0_cross_checked'':sum(1
    for r in p0 if r[''evidence_grade'']==''cross-checked'')},ensure_ascii=False));assert len(cc)>=47,''graded_crosschecked<47'';assert
    not bad,''triage_families<2''" || s=1

    rm -f "$f"

    exit $s

    '
- id: ledger-single-lineage-clause
