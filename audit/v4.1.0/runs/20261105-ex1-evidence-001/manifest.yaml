    f="$(mktemp)"

    "$PY" audit/v4.1.0/claims_selftest.py >"$f" 2>&1

    rc=$?

    cat "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    grep -q ''"arms": 17'' "$f" || s=1

    grep -q ''"not_ok": 0'' "$f" || s=1

    rm -f "$f"

    exit $s

    '
