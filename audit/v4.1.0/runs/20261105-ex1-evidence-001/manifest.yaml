notes:
  purpose: EX-1 的机器核对（R1/R2/R3/R4 反向变异 + MANIFEST 证据契约）归档，补上双血统裁定点名的第二处证据缺口
  commands: 13 条，全部 exit 0
  key_results:
    expert_ladder_machine_check: scripts/gate/test_expert_ladder.py 全过：R1 家族独立、R2 弃权不可被多数票压过、R3 假阳性需机器证据（反向变异
      rev_R1/rev_R2/rev_R3）、R4 席位标定（rev_R4）、证据契约（MANIFEST 带 source_agent/source_run/timestamp_started/conflict_resolution、产物哈希、篡改可检出）、词表拒绝（PASS/DONE
      都不合法）、rev_LOCK 不同端点不全局串行。**这是 EX-1 验收口径要的「夹具对 R1/R2/R3 各做反向变异后结论必须翻转」。**
    claims_selftest: 17 臂全按期望（该红的红、该绿的不该红），每次变更用备份还原
    ex6_failure_accounting: EX-6 标定账四臂全过
    prod_storage_gate: 生产存储门禁 R1–R6 全成立、FAIL=0
    audit_manifest_baseline: A01 证据门禁仍是那 7 条历史红（未放宽）
    honesty_check: P1-4 门禁 effect 声明与夹具账一致
    storage_semantics_check: IL-11 存储语义声称清单一致（28 条）
    claims_inventory_check: P1-5：claims_hits=1144 claims_ref=93，新增未绑定声明 0 条
    doc_facts_check: P2-1：文档索引逐字节一致；接进来的两个既有门禁都成立
    dir_policy_check: P2-2：新增违规 0 条（存量 149 条按基线记账）
    gate_registry_check: 门禁登记表不得漂移
    kanban_rows: 看板 54 行，SSOT 与渲染一致
    gov_metrics: 治理度量快照；check_n 仍为 168（分母未动）
  measurement_notes: claims-selftest 的 17 条臂**故意把判据驱动到红**，每条臂断言「判据必须变红」；命令自身 exit 0 记录的是「断言是否成立」，不是「判据是否绿」。
  self_reference_note: 本 run 目录自身在执行期间未提交 ⇒ 按 IL-6 的新口径（门禁按已提交树枚举）它不在判定范围内；提交后它会被纳入，历史判据未放宽。
  known_limitation: 本 run 不含 ci_gate.sh，不构成门禁通过声明。CI 侧第二血统复核被 IL-9（runner-03 缺镜像）挡住。第三轮双血统裁定中 qwen 血统八条全判
    REAL；另一血统本轮返回空（席位可用性），故 IL-4 与 EX-1 仍留在待复核 —— 缺口已补齐并重问，等该席位恢复后再问一轮即可收口。
