- id: expert-ladder-machine-check
  name: EX-1 的机器核对：R1/R2/R3/R4 反向变异 + MANIFEST 证据契约 + 词表拒绝
  cwd: .
  timeout_sec: 900
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" scripts/gate/test_expert_ladder.py >"$f" 2>&1

    rc=$?

    tail -30 "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    grep -q "ALL EXPERT-LADDER CHECKS PASS" "$f" || s=1

    grep -q "rev_R1" "$f" || s=1

    grep -q "rev_R2" "$f" || s=1

    grep -q "rev_R3" "$f" || s=1

    rm -f "$f"

    exit $s

    '
- id: claims-selftest
