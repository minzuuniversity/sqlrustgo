notes:
- 本 run 不含 ci_gate.sh，不构成门禁 PASS 声明。
- P1-3 的三件东西：台账 docs/releases/v4.1.0/NEG_FIXTURES_v4.1.0.jsonl（56 行 = 55 道 scope +
  1 道 scope 外加测）、13 个夹具 audit/v4.1.0/neg/fx01..fx13、探针 audit/v4.1.0/probe_neg_fixtures.py（check
  / fixtures / selftests / mutation-selftest）。当期 falsifiable_now=11/55（mutation 8
  + selftest 3），另有 1 道被证明不可证伪、44 道 pending-fixture。
- 'fixtures 实测：pass=10 fail=0 error=0 deferred-selftest-red=3。fx01–fx08 把 7 道阶段门禁
  + 1 道 entry 门禁跑红；fx09/fx10 实测门禁 rc=0（各自打印 FAIL/FAILED_ITEMS 却不影响退出码），即两条 fail-open
  洞，登记为看板 NF-1 / ISSUE #5598，修不修判定语义属 owner（AGENTS 2.1/3.2 + #5595）。'
- selftests 用的是行为判据：clean_rc=0 且**把同一份检测器致残后 selftest 必须翻红**（neutered_selftest_rc=1），探针自己解析
  NEUTERED_SELFCHECK_RC= 取值，不信夹具退出码。三道门禁（check_commit_message / check_coverage_single_implementation
  / check_gate_test_integrity）全部 OK ⇒ 它们的自带自测是 load-bearing 的。
- mutation-selftest：先要求台账基线 findings=0（基线不干净时臂的战果不可归因，探针直接失败），随后 11 臂 ok=11 bad=0：M1–M10
  打在台账语义上，BA1 打在 selftests 行为判据上（只打印 rc=0、什么都不破坏的假夹具必须让判据 NOT-OK）。
- 门禁分母未动：gate_registry 报 check_n=168 / catalog_rows=168 / fails=0；本轮没有新增门禁、没有改阈值或跳过开关，新工具命名
  probe_* 且住在 audit/v4.1.0/ 下，不进 scripts/gate、不进 STAGE_CONFIG 阶段清单。
- 自指度量当期取值：docs410 从 75 变 76（本 run 新增了 NEG_FIXTURE_PROGRAM 报告），claims_hits 仍是 1146（报告刻意不写那三个宣称标记词，见报告
  §6）；neg_fixture_n=23 仍是「门禁脚本源码里出现关键字」的口径，不是夹具覆盖率；audit_runs=10、audit_manifests=23、audit_manifests_runs=17
  随归档本身漂移，不能作为进度。
- 取证 run audit/v4.1.0/runs/20261105-negfix-001 原样保留：它失败在命令 004，原因是第一版 selftests 判据按输出形状猜「有没有负向断言」，误判两道门禁；那是判据的缺陷，不是门禁的缺陷。
- 看板 P1-3 记「待复核」不记完成：44 条 pending-fixture 未做（21 runtime / 12 cargo / 7 external /
  3 composite / 1 static），且 CI 侧受 IL-9（runner-03 缺镜像）限制，本 run 的本地证据不等于 CI 证据。
