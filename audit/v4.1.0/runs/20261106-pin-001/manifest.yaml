  cmd: "/usr/bin/python3 - <<'PYIN'\nimport json,subprocess,sys,urllib.request\nNL=chr(10)\ndef token():\n\
    \    p=subprocess.run([\"git\",\"credential\",\"fill\"],input=b\"url=http://192.168.0.252:3000\"+NL.encode()+NL.encode(),capture_output=True)\n\
    \    for line in p.stdout.decode().splitlines():\n        if line.startswith(\"password=\"): return\
    \ line.split(\"=\",1)[1]\n    raise SystemExit(\"no credential\")\nreq=urllib.request.Request(\"http://192.168.0.252:3000/api/v1/repos/openclaw/sqlrustgo/issues/5592/comments?page=1&limit=50\"\
    ,\n                           headers={\"Authorization\":\"token \"+token()})\nrows=json.loads(urllib.request.urlopen(req,timeout=40).read().decode())\n\
    pins=[r for r in rows if \"HANDOFF-PIN:src=\" in (r.get(\"body\") or \"\")]\nprint(json.dumps({\"\
    kind\":\"entry_presence\",\"issue\":5592,\"comments_total\":len(rows),\n                  \"pin_count\"\
    :len(pins),\"pin_ids\":[r[\"id\"] for r in pins],\n                  \"pin_markers\":[(r.get(\"body\"\
    ) or \"\").splitlines()[0] for r in pins]},ensure_ascii=False))\nif len(pins)!=1:\n    print(\"NOT-OK:\
    \ 看板上的 pin 评论不是恰好一条\",file=sys.stderr); sys.exit(3)\nPYIN"
