note: '本目录是权威轮 **20261118-ga-gates-016** 的归档：计划 35 项、**35 项全部执行并落账**，总耗时 26049.6 s，状态分布 **PASS 33 / INCOMPLETE 2**。


  ## 两项非 PASS 都是「执行超时」，不是门禁判红


  第 20 项 `scripts/gate/check_full_gate_verification.sh` 与第 33 项 `cargo test --all-features` 的 duration_s **都恰好等于本轮的执行超时上限**（run_gates.py --timeout-sec **10800**）⇒ exit_code=124 / state=INCOMPLETE。


  015 轮把上限设为 7200 时，这两项分别是「第 20 项超时、第 33 项 PASS（6254.2 s）」；016 轮把上限**放宽一倍**到 10800 后，**两项都超时**。


  **已排除的两种解释**：① **代码面变化** —— 016 轮树 3732811582 相对 015 轮树 680418e9f9 的差异**全部在 docs/ 与 audit/**（非 docs/audit 目录变更数 = 0），两轮二进制指纹完全相同（3574da045b956f86… / 944b58aea8b04b92…）；② **休眠导致变慢** —— 本机 `pmset -g` 显示 `SleepDisabled = 1`。


  **机理（已定性）**：prep 的默认 features 预构建（`cargo test --no-run`）会把 target 里的 all-features 产物**覆盖**成默认侧版本 —— 这是为让门禁里每个默认侧 `cargo test --test X` 不必重编译（G10 的 60 s 探针预算）而刻意做的；代价是 `cargo test --all-features` 必须**整树重编译**才能跑起来，这段编译时间被计入门禁超时。⇒ 这是**执行预算**问题。


  **产物缺口的处置**：run_gates.py 的超时分支不落盘 stdout/stderr ⇒ 两项都没有输出产物。归档里该位放的是**自声明「本文件不是门禁输出」**的缺口占位（含超时事实、exit_code=124、duration_s=10800.0、已排除的解释与补法），**不冒充门禁判定、不补写**。


  **补法**：把执行超时上限放宽到 **21600 s（6 h）** 重跑。放宽的是**运行参数**，门禁判据/阈值/分母未动 —— plan sha256 仍为 sha256:6466a0ec156075daf3bc53ece379c4ecc2b13b63da27cd17a1f39cb2254da809（由 gate 名单唯一决定，prep 脚本强校验，不符即中止）。


  ## 这一轮仍然证实了 D6 修复


  第 13 项 `check_g1_tpch_baseline.sh` PASS、第 1 项 `check_rc_ga_gate.sh` PASS，且**没有任何一项判红** ⇒ 被测行为无回归。'
