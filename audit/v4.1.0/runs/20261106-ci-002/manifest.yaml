- id: probe-workflow-yaml
  name: Gitea 工作流 YAML 必须解析通过且无重复键（重复键会让后一个键静默覆盖前一个）
  cmd: "python3 - <<'PYEOF'\nimport yaml, glob\nclass L(yaml.SafeLoader): pass\ndef nodup(loader, node,\
    \ deep=False):\n    seen = set()\n    for kn, vn in node.value:\n        k = loader.construct_object(kn,\
    \ deep=deep)\n        if k in seen:\n            raise ValueError(f\"重复键 {k!r} at {kn.start_line +\
    \ 1}\")\n        seen.add(k)\n    return loader.construct_mapping(node, deep)\nL.add_constructor(\"\
    tag:yaml.org,2002:map\", nodup)\nbad = []\nfiles = sorted(glob.glob(\".gitea/workflows/*.yml\"))\n\
    for f in files:\n    try:\n        yaml.load(open(f, encoding=\"utf-8\").read(), Loader=L)\n    except\
    \ Exception as e:\n        bad.append((f, str(e)[:120]))\nprint(f\"检查 {len(files)} 个工作流文件:\", \"全部解析通过且无重复键\"\
    \ if not bad else bad)\nraise SystemExit(1 if bad else 0)\nPYEOF\n"
  cwd: .
  timeout_sec: 300
