    "$PY" -c "import re;t=open(''$f'').read().strip().splitlines()[-1];g=lambda k:int(re.search(k+r''=(\\d+)'',t).group(1));assert
    g(''checks'')==4 and g(''ok'')==4 and g(''not_ok'')==0, t" || s=1

    rm -f "$f"

    exit $s

