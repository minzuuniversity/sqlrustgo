commands:
- id: cap-run
  name: 能力声明五探针（真 CLI/真 MySQL/真落库/崩溃重启/备份恢复逐值）
  cwd: .
  timeout_sec: 900
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" audit/v4.1.0/capability_claims.py run >"$f" 2>&1

    rc=$?

    cat "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    "$PY" -c "import json;d=json.load(open(''$f''));assert d[''verified'']==5 and d[''failed'']==0 and
    d[''not_verified'']==0, d" || s=1

    rm -f "$f"

    exit $s

    '
- id: cap-selftest
  name: 能力探针反向变异（十条对照）
  cwd: .
  timeout_sec: 1200
  cmd: 'PY="$(command -v python3.14 || command -v /usr/bin/python3)"

    f="$(mktemp)"

    "$PY" audit/v4.1.0/capability_claims.py selftest >"$f" 2>&1

    rc=$?

    cat "$f"

    s=0

    [ "$rc" -eq 0 ] || s=1

    "$PY" -c "import json;d=json.load(open(''$f''));assert d[''checks'']==10 and d[''ok'']==10 and d[''not_ok'']==0,
    d" || s=1

    rm -f "$f"

    exit $s

    '
- id: gate-a01-default-interp
  name: A01 门禁在默认 python3（无 PyYAML）下必须仍判那 7 条历史红
  cwd: .
  timeout_sec: 600
  cmd: 'f="$(mktemp)"

    bash scripts/gate/check_audit_manifest.sh >"$f" 2>&1

    rc=$?

    grep "^FAIL:" "$f"

    n=$(grep -c "^FAIL:" "$f")

    echo "exit_code=$rc fail_count=$n"

    s=0

    [ "$rc" -eq 1 ] || s=1

    [ "$n" -eq 7 ] || s=1

    rm -f "$f"

    exit $s

    '
- id: gate-a01-broken-interp
  name: A01 门禁指向无 PyYAML 的解释器时必须只报「无法判定」，不得伪造证据红
  cwd: .
  timeout_sec: 600
  cmd: 'f="$(mktemp)"

    SQLRUSTGO_GATE_PYTHON=/opt/homebrew/bin/python3 bash scripts/gate/check_audit_manifest.sh >"$f" 2>&1

    rc=$?

    cat "$f"

    n=$(grep -c "^FAIL: audit run" "$f")

    echo "exit_code=$rc fabricated_evidence_fails=$n"

    s=0

    [ "$rc" -eq 1 ] || s=1

    grep -q "cannot judge" "$f" || s=1

    [ "$n" -eq 0 ] || s=1

    rm -f "$f"

    exit $s

    '
- id: gate-a01-good-interp
  name: A01 门禁在有 PyYAML 的解释器下必须仍是那 7 条历史红
  cwd: .
  timeout_sec: 600
  cmd: 'f="$(mktemp)"

    SQLRUSTGO_GATE_PYTHON=/usr/bin/python3 bash scripts/gate/check_audit_manifest.sh >"$f" 2>&1

    rc=$?

    grep "^FAIL:" "$f"

    n=$(grep -c "^FAIL:" "$f")

    echo "exit_code=$rc fail_count=$n"

    s=0

    [ "$rc" -eq 1 ] || s=1

    [ "$n" -eq 7 ] || s=1

    rm -f "$f"

    exit $s

    '
- id: gate-a01-selftest
  name: A01 门禁自带自测（在飞 run 不得被判红）
  cwd: .
  timeout_sec: 600
  cmd: 'f="$(mktemp)"

