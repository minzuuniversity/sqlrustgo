    \ docs/releases/v4.1.0/GA_RELEASE_TIMELINE.md \\\n         docs/releases/v4.1.0/CHANGELOG.md; do\n\
    \  test -f \"$f\" || { echo \"MISSING $f\"; exit 1; }\n  echo \"OK $f\"\ndone\n"
  cwd: .
  timeout_sec: 120
- id: gate-anti-fabrication
  name: AFP v4 反伪造门禁（HEAD 作者必须是已登记身份；本批补录 omp-macmini）
  cmd: bash scripts/gate/check_anti_fabrication.sh
  cwd: .
  timeout_sec: 1800
- id: probe-afp-author-allowlist
  name: 反向变异：未登记身份做 HEAD ⇒ 同一函数必须报错（改后没有放松判据）
  cmd: "tmp=$(mktemp -d /Volumes/workspace/dev/afpmut-XXXXXX)\n{ echo 'ERRORS=0'\n  echo 'log_info() {\
    \ :; }'; echo 'log_error() { echo \"[ERROR] $*\" >&2; ERRORS=$((ERRORS+1)); }'\n  echo 'log_pass()\
    \ { :; }'\n  awk '/^check_head_commit_author\\(\\)/,/^}/' scripts/gate/check_anti_fabrication.sh\n\
    } > \"$tmp/h.sh\"\ngit worktree add -q --detach \"$tmp/wt\" HEAD\n( cd \"$tmp/wt\" \\\n  && git -c\
    \ user.name=\"Probe\" -c user.email=\"probe-unknown-identity@gaoyuanyiyao.com\" \\\n       commit\
    \ -q --allow-empty -m probe \\\n  && bash -c \"source $tmp/h.sh; check_head_commit_author >/dev/null\
    \ 2>&1; echo ERRORS=\\$ERRORS\" ) \\\n  | grep -q 'ERRORS=1' || { echo \"MUTATION NOT CAUGHT\"; exit\
    \ 1; }\necho \"MUTATION CAUGHT\"\ngit worktree remove --force \"$tmp/wt\" 2>/dev/null || true\ngit\
    \ worktree prune 2>/dev/null || true\nrm -rf \"$tmp\"\n"
  cwd: .
  timeout_sec: 300
- id: cargo-test-all-features
  name: GA 清单 cargo 命令（原文）：cargo test --all-features（本批 54 个文件是 clippy 自动修复，必须由全量测试兜底）
