  cmd: python3 audit/v4.1.0/issue_closing_refs.py --issue 5520 --issue 5702 --issue 5717 --issue 5598;
    rc=$?; echo "control-set exit=$rc （预期非 0：判据必须能拦住没修的 issue）"; exit $rc
  cwd: .
  timeout_sec: 600
- id: closing-refs-field-absence-evidence
  name: 取证臂：Gitea 的 issue payload 里根本没有 closedByPullRequestsReferences 这个键（GitHub 专有字段）⇒ Step 1 的字面判据在本仓无执行点；同一条命令打印
  cmd: 'python3 -c "import json,urllib.request,subprocess; B=''http://192.168.0.252:3000/api/v1/repos/openclaw/sqlrustgo'';
    p=subprocess.run([''git'',''credential'',''fill''],input=b''url=http://192.168.0.252:3000\n\n'',capture_output=True);
    tok=[l.split(''='',1)[1] for l in p.stdout.decode().splitlines() if l.startswith(''password='')][0];
    get=lambda u: json.loads(urllib.request.urlopen(urllib.request.Request(u,headers={''Authorization'':''token
    ''+tok}),timeout=40).read().decode()); d=get(B+''/issues/3186''); print(''== 已关闭 issue #3186 的 payload
    ==''); print(''  closedByPullRequestsReferences in payload:'', ''closedByPullRequestsReferences''
    in d); print(''  相关字段:'', [k for k in d if any(t in k.lower() for t in (''clos'',''ref'',''pull''))]);
    print(''  state='', d.get(''state''), ''closed_at='', d.get(''closed_at'')); print(''== #5498 timeline
    的 pull_ref 条目 ==''); [print(''   PR #%s state=%s'' % ((e.get(''ref_issue'') or {}).get(''number''),
    (e.get(''ref_issue'') or {}).get(''state''))) for e in get(B+''/issues/5498/timeline?limit=50'') if
    isinstance(e,dict) and e.get(''type'')==''pull_ref'']"'
  cwd: .
  timeout_sec: 300
- id: closing-refs-gate-denominator
  name: 分母臂：门禁分母 check_n 必须仍是 168（新工具不叫 check_*、不进 STAGE_CONFIG ⇒ 分母不动）
  cmd: python3 scripts/gate/gov_probe.py metrics | python3 -c "import sys,json; [print('check_n =', json.loads(l)['check_n'])
    for l in sys.stdin if l.strip() and 'check_n' in json.loads(l)]"
  cwd: .
  timeout_sec: 300
