note: "本目录是一轮**跑满 35/35** 的权威认证轮（round_status = FAIL）：35 项全部执行并落账，\n总耗时 7233 s，状态分布 **PASS 33 / FAIL 1 / INCOMPLETE 1**。\n\n## 两处非 PASS 同源（已定位到提交）\n\n第 20 项（check_full_gate_verification.sh —— D9 汇总里唯一红维度 **D6b Test\nInventory: FAIL**）与第 33 项（cargo test --all-features ⇒ `error: test failed,\nto rerun pass --test gate_honesty_test`）指向**同一个**过期计数用例\n`test_5419_every_curated_d6_entry_resolves_to_a_cargo_target`。\n\n根因：那个用例断言 curated D6 清单**恰好 49 条且全部解析成功**，而清单现为 **50 条**。\n逐树对账（现算）：`7fe24a8636`(#5827)=49/49、`f327286c01`(#5842)=49/49、\n`2cd1a0c7f5`(#5847)=**50/49**、`e5c42c7fd0`(本轮树)=50/49。第 50 条由\n**`cf9f93cda8` = #5846**（把 #5490 的回归测试接进 GA 轮的执行范围）加入 D6 契约，\n但**没有同步**期望值。\n\n**解析器本身无缺陷**：现场实测 `RESOLVED=50` / `UNRESOLVED=[]` / `LIST_SIZE=50`\n—— 50 条全部解析成功，失败纯因**硬编码计数过期**。\n\n⚠️ 讽刺且必须登记：#5846 的目的**正是**让 GA 轮执行 #5490 的回归测试（此前它放在\n`crates/mysql-server/tests/` 下，不在根包 `[[test]]` 集合里，`cargo test --all-features`\n根本不会编译它），而它自己的计数遗漏让 GA 轮第 33 项判红 ⇒ **GA 轮至今没有给出\n这条修复的有效判定**，与 #5846 的目的正好相反。\n\n## 第 13 项 TPC-H 通过 —— 基线逐字节可复现\n\n低负载（load average 由 186 降至约 105，Spotlight 已停止索引本卷）下实测：\n`tpch_hash_test` **50 passed / 0 failed**、`G1 PASS: TPC-H 22/22 baseline hash\nmatches (7439ce80…)`、门禁 exit=0（16.2 s）。⇒ **实算哈希 = 基线值\n7439ce80589f262b8e3291735fdef9507d8e13d62029708b3682a3d02cf883a3**，**不存在基线\n漂移，也不存在代码回归**；013 轮那一次 FAIL 归因为**高负载下的环境暂态**。\n\n哈希稳定性复验：低负载下连跑 4 次，哈希全部相同，耗时 1.60 / 1.57 / 1.57 / 1.58 s。\n⚠️ 复验时踩到的坑并已登记：**不设 `TPCH_DATA_DIR` 时测试会空转**，报\n`50 passed` 但耗时仅 0.01–0.03 s —— 那不是执行。判定 TPC-H 真跑必须同时看\n**耗时**与 **`G1 PASS` 行**（`cargo test` 默认捕获 stderr，`G1 PASS` 行只在\nstep 4 的比较器或 `-- --nocapture` 下可见）。\n\n诊断补丁已在**真实场景**验证（不止夹具）：用故意错误的期望哈希跑\n`tpch_hash_compare.py --check 0000…` ⇒ 输出 `expected: 0000…` /\n`actual: 7439ce80…`，且**退出码仍为 1**（匹配时为 0）⇒ **只增加信息，不削弱判据**。\n\n## 本轮不能作最终验收轮\n\n第 20/33 项的根因需要改**一个门禁相关测试的期望值**（代码面变化）⇒ 最终判定由在\n同一代码面上重跑的轮次承担。本轮材料的价值是：它**跑满**了 35 项、给出了 TPC-H 的\n有效判定、并把「D6 清单第 50 条」这个既有遗漏**首次暴露**（013 轮因未跑到第 33 项\n而未暴露）。\n\n另：168h SOAK 的独占窗口仍未满足，且本轮取证期间 SOAK 宿主 252 一度**整机不可达**\n⇒ 该 SOAK 轮的状态待复核。\n\n材料引用的每一个数字都出自本目录，由脚本现算，不手抄。\n"
