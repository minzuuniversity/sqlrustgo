commands:
- id: negfix-ledger-check
  name: 台账结构/语义/证据落盘对账（缺 run 时 fail-closed）
  cmd: python3 audit/v4.1.0/probe_neg_fixtures.py check
  cwd: .
  timeout_sec: 300
- id: negfix-scratch-add
  name: 建 detached scratch 工作树（夹具只在此树内注入）
  cmd: git worktree add --detach /private/tmp/negfix-20261105-negfix-001 "$(git rev-parse HEAD)"
  cwd: .
  timeout_sec: 300
- id: neg-fixtures
  name: 10 个夹具在 scratch 树里注入缺陷跑真实门禁
  cmd: python3 audit/v4.1.0/probe_neg_fixtures.py fixtures --tree /private/tmp/negfix-20261105-negfix-001
  cwd: .
  timeout_sec: 1200
- id: neg-selftests
  name: 3 条 selftest-verified 门禁的自带反向夹具实跑
  cmd: python3 audit/v4.1.0/probe_neg_fixtures.py selftests --tree /private/tmp/negfix-20261105-negfix-001
  cwd: .
  timeout_sec: 1200
- id: negfix-mutation-8arms
  name: 探针自身的反向变异（8 臂，台账缺陷必须让 check 变红）
  cmd: python3 audit/v4.1.0/probe_neg_fixtures.py mutation-selftest
  cwd: .
  timeout_sec: 600
- id: negfix-scratch-remove
  name: 清理 scratch 工作树
  cmd: git worktree remove --force /private/tmp/negfix-20261105-negfix-001
  cwd: .
  timeout_sec: 300
- id: gate-registry-check
  name: 门禁清单回归（分母必须仍是 168）
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 300
- id: gate-registry-fixtures
  name: 门禁清单回归夹具
  cmd: python3 scripts/gate/test_gate_registry.py
  cwd: .
  timeout_sec: 300
- id: kanban-44-rows
  name: 看板 SSOT 渲染一致性（44 行）
  cmd: bash -c 'python3 scripts/gate/kanban_render.py check docs/releases/v4.1.0/KANBAN_v4.1.0_ALPHA.md
    | grep -q "44 rows"'
  cwd: .
  timeout_sec: 120
- id: gov-probe-metrics
  name: 自指度量当期取值（含 neg_fixture_n 关键字口径，见 NEG_FIXTURE_PROGRAM §6）
  cmd: python3 scripts/gate/gov_probe.py metrics
  cwd: .
  timeout_sec: 900
