- id: lint1b3-clippy-inventory
  name: "批次 3 后复测 clippy 欠账分类计数（与批次 1/2 同一命令口径：不带 -D warnings，要的是欠账清单本身）。批次 2 归档 run 实测基线 143 条诊断行、目标类 useless use of vec! 21 处 ⇒ 本批后该类应 0、总数应减 21、其余各类计数一字不变"
  cmd: cargo clippy --workspace --all-features --all-targets --keep-going
  cwd: .
  timeout_sec: 5400
- id: lint1b3-mutation-fixture
  name: "计数判据的鉴别力夹具（基线该类 0 ⇒ 注入把 &vec![…] 传给收 &[i32] 的函数的反模式探针，计数必须回弹 ≥1 且点名注入文件 ⇒ 恢复后必须逐字节一致并回到 0；批次 2 实测的三个空转坑——标志组合、argv 拆分、缓存重放——本夹具逐个避开）"
  cmd: python3 scripts/gate/test_lint1b3_mutation_fixtures.py
  cwd: .
  timeout_sec: 3000
- id: lint1b3-crash-server-build
  name: "armed 构建第一步：带 fault-injection 的 server 二进制（崩溃套件按 <repo>/target/debug/sqlrustgo-mysql-server 找它；本 run 的 target 是指向共享 target 的符号链接）"
  cmd: cargo build -p sqlrustgo-mysql-server --all-features
  cwd: .
  timeout_sec: 3600
- id: lint1b3-touched-crates-tests
  name: "无行为变化证据：被改动 crate 的全部测试（tools / storage / optimizer / cli）。批次 3 改的三处全在 sqlrustgo-storage 的 #[cfg(test)] 模块里（engine.rs 12、page.rs 4、bplus_tree/index.rs 5），其中 5 处是 let 绑定改数组字面量 ⇒ contains/iter 的语义必须靠测试而不是靠 clippy 绿来证明"
  cmd: cargo test -p sqlrustgo-tools -p sqlrustgo-storage -p sqlrustgo-optimizer -p sqlrustgo-cli
  cwd: .
  timeout_sec: 5400
- id: lint1b3-crash-wal-index-armed
  name: "崩溃套件（armed）：与 touched-crates-tests 里的同一测试互为对照（一条走 dev-dependency 自动开 feature，一条显式 --features）"
  cmd: cargo test -p sqlrustgo-storage --features fault-injection --test crash_wal_index_b1
  cwd: .
  timeout_sec: 3600
- id: lint1b3-check-all-targets
  name: "全 workspace 全目标编译校核（0 error 才算这批没把哪个测试目标改坏；绑定改数组是这批唯一可能破坏类型的形态）"
  cmd: cargo check --workspace --all-targets --all-features
  cwd: .
  timeout_sec: 3600
- id: lint1b3-gate-anti-ignore
  name: "忽略台账（本批不新增 ignore：total_allowed 应仍 136 ≤ 150、ACTIVE 仍 82 ≤ 92，且与树内真实 #[ignore] 属性数一致）"
  cmd: bash scripts/gate/check_anti_ignore_gate.sh
  cwd: .
  timeout_sec: 900
- id: lint1b3-gate-registry
  name: "门禁登记表一致性（分母仍 168：新增夹具命名 test_lint1b3_mutation_fixtures.py，不占 check_*）"
  cmd: python3 scripts/gate/gate_registry.py check
  cwd: .
  timeout_sec: 900
- id: lint1b3-gate-drift-not-pass
  name: "DRIFT 门禁本体（上批改后的判据不得回退）"
  cmd: bash scripts/gate/check_drift_not_pass.sh
  cwd: .
  timeout_sec: 900
- id: lint1b3-gate-docs-pointer-paths
  name: "文档指针路径门禁（本批看板文字新增了一批反引号路径，不得引入断链）"
  cmd: bash scripts/gate/check_docs_pointer_paths.sh
  cwd: .
  timeout_sec: 900
