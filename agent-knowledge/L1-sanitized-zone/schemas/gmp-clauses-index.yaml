## 可提取的 Agent 规则

### 来自总则（第1-30条）

```yaml
rule_id: GMP-GEN-001
description: 质量管理部门独立性
source: GMP第2条
agent_check:
  - QA部门是否独立设置
  - QA职责是否与生产部门分离
  - QA是否有放行决定权
violation_type: regulatory
severity: critical
```

```yaml
rule_id: GMP-GEN-002
description: 注册工艺不可擅自变更
source: GMP第23条
agent_check:
  - 处方工艺是否与注册批准一致
  - 任何变更是否经过变更控制
violation_type: regulatory
severity: critical
```

### 来自飞检重点汇总

```yaml
rule_id: GMP-AUDIT-001
description: 飞检高频缺陷项
source: openclaw_supplement/01_GMP条款解释 各章飞检重点
top_deficiencies:
  - QA人员配置不足，职责不清
  - 质量手册与实际操作脱节
  - 缺少系统性的偏差管理和CAPA机制
  - 设备校准超期使用
  - 批记录不完整或后补
  - 数据完整性问题
  - 清场不彻底导致交叉污染
  - 供应商审计缺失
agent_use: "Agent 可将这些作为实时合规检查的重点监控项"
```

