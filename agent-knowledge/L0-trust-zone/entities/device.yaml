# GMP 实体定义：设备（Device）

> 来源: 2025GMP-MD/04_/SOP (119份) + 04_/VAL (62份)
> 隔离层级: L0-trust-zone（禁止出云）
> 提取日期: 2026-05-20

---

## 实体 Schema

```yaml
entity_type: device
properties:
  code:             { type: string, required: true, description: "设备编号" }
  name:             { type: string, required: true, description: "设备名称" }
  model:            { type: string, description: "型号" }
  location:         { type: string, description: "安装位置" }
  clean_area_level: { type: enum, values: [D级, C级, B级, A级, 非洁净区], description: "洁净级别" }
  calibration_cycle: { type: string, description: "校准周期" }
  calibration_due:  { type: date, description: "下次校准日期" }
  maintenance_cycle: { type: string, description: "维护周期" }
  status:           { type: enum, values: [运行中, 停机, 维修中, 校准过期, 待清洁], required: true }
  sop_ref:          { type: string, description: "操作规程编号" }
  qualification_status: { type: enum, values: [已确认, 待再确认, 过期], description: "确认状态" }
```

