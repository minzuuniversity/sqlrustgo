## 关联关系

```yaml
relationships:
  - device -> sop:           "遵循操作规程"
  - device -> calibration:   "需要校准"
  - device -> maintenance:   "需要维护"
  - device -> batch:         "用于生产批次"
  - device -> clean_status:  "清洁状态"
  - device -> operator:      "授权操作人员"
```

## Agent 使用场景

1. **设备校准检查**: Agent 在操作前自动检查 calibration_due，若过期则阻止操作并触发校准工单
2. **清洁状态验证**: 操作前 Agent 查询设备清洁状态，确认清场合格
3. **操作权限验证**: Agent 检查操作人员是否在 device -> operator 授权列表中
