## 稳定性考察与留样

```yaml
rule_id: QMS-007
description: 留样管理
source: phase2/qms/留样管理规程.md
applies_to: 留样管理
requirements:
  - "每批产品留样量至少为全检量的2倍"
  - "留样条件与贮存条件一致"
  - "留样期限为有效期后1年"

rule_id: QMS-008
description: 稳定性试验管理
source: phase2/qms/稳定性试验管理规程.md
applies_to: 稳定性考察
types:
  - type: 长期稳定性
    conditions: "25°C±2°C / 60%RH±5%RH"
    frequency: "0,3,6,9,12,18,24,36月"
  - type: 加速稳定性
    conditions: "40°C±2°C / 75%RH±5%RH"
    frequency: "0,1,2,3,6月"
  - type: 影响因素试验
    conditions: "高温/高湿/强光"
    frequency: "0,5,10,30天"
```
