name: CI Alpha Stage Gates
run-name: alpha-stage-gates version=${{ inputs.version }} stage=ALPHA

# The ALPHA stage gates of v4.1.0 need a **real execution point**: a place in
# CI where `docs/governance/STAGE_CONFIG.yaml -> stages.ALPHA.required_gates`
# is actually executed, not parsed and printed.
#
# WHY THIS IS A SEPARATE WORKFLOW AND NOT A STEP IN ci.yml
# ---------------------------------------------------------
# (R52 of the v4.1.0 readiness plan; the reasoning is reproduced verbatim
# because it is the reason this file exists at all.)
#
# 1. **C8 forbids it.** The plan's original proposal was a step inside
#    ci.yml guarded by `if: startsWith(github.ref, 'refs/heads/develop/')`.
#    That step fires on **every push** to a `develop/` branch and would run
#    the whole ALPHA list each time. C8 says: "ALPHA stage gates must not be
#    executed in full on every push (ci.yml:1700-1704)". A job-level `if:`
#    inside ci.yml therefore violates C8 by construction.
#
# 2. **ci.yml's concurrency group would cancel other people's runs.**
#    ci.yml uses the group `sqlrustgo-ci-pipeline-v2` with
#    `cancel-in-progress: true`. Any *non-push* trigger placed inside ci.yml
#    (`schedule` or `workflow_dispatch`) would cancel the runs other people
#    have in flight. `ci-trusted-baseline.yml` documents exactly this ban in
#    its own header — it is a separate workflow precisely because of it.
#    Putting the ALPHA execution point in ci.yml would put it under a
#    concurrency group that cancels siblings.
#
# 3. **A promotion is a human decision.** The ALPHA list is executed when a
#    release line is promoted, which is an owner action
#    (docs/governance/VERSION_PROMOTION_SOP.md). `workflow_dispatch` is the
#    trigger that says "a human decided to run this now", and it is the only
#    trigger that does not fire on anybody's push.
#
# Consequently: this workflow has its **own** concurrency group and
# `cancel-in-progress: false`, it is **dispatch-only**, and the ALPHA step
# itself additionally requires the ref to be a `develop/` branch so that a
# dispatch against, say, a release tag does not silently judge the wrong
# tree.
#
# WHAT THIS WORKFLOW DELIBERATELY DOES NOT DO
# --------------------------------------------
# * It does **not** use `--dry-run`. `--dry-run` only parses the stage list
#   and prints it; every gate in it stays unexecuted, which is a fake green
#   (Review Focus #5 of the readiness plan).
# * It does **not** add a second ALPHA execution point anywhere else
#   (R53: one execution point, not two — two would be the "second harness"
#   that global constraint C2 forbids).
# * It does **not** weaken any gate: the command is the SSOT driver
#   `scripts/gate/check_stage.sh` with the stage and version taken from the
#   dispatch input.
#
# KNOWN COST (R51) — this is a residual item for the next task, not a defect
# introduced here:
#   `check_stage.sh` is a **two-state** driver. It cannot distinguish
#   "the gate said FAIL" from "the gate timed out / was killed / does not
#   exist" — all three collapse into a non-zero exit code. The tri-state
#   tools (`scripts/gate/run_gates.py execute` + `scripts/gate/gate_report.py
#   report`) keep INCOMPLETE apart from FAIL, and the negative fixtures in
#   `audit/v4.1.0/neg/` use those two for their two-layer RED proof. The
#   CI execution point deliberately uses the two-state driver because it is
#   the SSOT driver that BETA/RC/GA also use (one execution surface, C2).
#   The price — losing INCOMPLETE semantics at the CI execution point — is
#   registered as a residual item, not silently swallowed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release line to judge, e.g. v4.1.0 (the stage list is read from STAGE_CONFIG.yaml)."
        required: true
        default: v4.1.0
        type: string

concurrency:
  # Its own group: this workflow must never cancel the pipeline group's runs
  # and must never be cancelled by it. Two dispatches of the same promotion
  # are both allowed to finish — the point of a promotion run is its
  # evidence, not the first one to arrive.
  group: sqlrustgo-ci-alpha-stage
  cancel-in-progress: false

jobs:
  alpha-stage-gates:
    runs-on: [hp-z6g4]
    # The ALPHA list contains three cargo invocations (build / test / fmt)
    # plus seven gate scripts; on a cold target this does not fit into a
    # short budget. A run that hits the limit produces no verdict at all,
    # which is the correct outcome — but it must be stated, not hidden.
    timeout-minutes: 180
    container:
      volumes:
        # Same bind mount as ci.yml: the named volume is ignored by act
        # ("not a valid volume"), so the cargo cache only survives across
        # jobs with a host bind.
        - /opt/cargo-cache:/opt/cargo-cache
    steps:
      - name: Checkout
        # The canonical checkout body, byte-identical to the one in
        # scripts/gate/check_ci_checkout_consistency.sh.  Rule C2 of that
        # gate asserts it; this workflow embeds the same copy.
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-}"
          if [ -z "$REPO_URL" ]; then
            SERVER_URL="${GITHUB_SERVER_URL:-}"
            if [ -z "$SERVER_URL" ]; then
              echo "FATAL: neither CI_REPO_URL nor GITHUB_SERVER_URL is set - refusing to guess which Gitea instance to clone from" >&2
              exit 1
            fi
            REPO_URL="${SERVER_URL}/openclaw/sqlrustgo.git"
          fi
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi
      - name: Restore cargo registry cache (issue #5451)
        run: bash scripts/ci/cache_cargo_registry.sh restore
      - name: ALPHA stage gates — real execution on the develop carrier
        # The ref guard is the second half of C8: the promotion is
        # dispatched manually, and it is only meaningful on a `develop/`
        # carrier (the stage list's branch_pattern is ["develop/v*"]).
        # A dispatch against any other ref runs nothing and says so.
        if: startsWith(github.ref, 'refs/heads/develop/')
        run: bash scripts/gate/check_stage.sh --version "${{ inputs.version }}" --stage ALPHA
      - name: ALPHA stage gates — skipped (not a develop/ carrier)
        if: ${{ !startsWith(github.ref, 'refs/heads/develop/') }}
        run: |
          set -euo pipefail
          echo "SKIPPED: ref '${GITHUB_REF:-unknown}' is not a develop/ carrier."
          echo "         The ALPHA list was NOT executed; this run carries no verdict."
          exit 0
