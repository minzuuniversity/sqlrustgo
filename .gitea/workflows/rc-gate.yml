name: RC Gate Pipeline
run-name: R-Gate v3.4.0

on:
  push:
    branches:
      - rc/v3.4.0
    tags:
      - v*-rc*
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REPO_URL: "http://192.168.0.252:3000/openclaw/sqlrustgo.git"
  REPO: "openclaw/sqlrustgo"
  GATE_IMAGE: "192.168.0.252:5000/sqlrustgo-gate:v5"

jobs:
  rc-gate:
    runs-on: [hp-z6g4, hp-z6g4, hp-z6g4, hp-z6g4]
    parallel: true
    steps:
      - name: Checkout & Run RC Gate
        run: |
          docker run --rm \
            -e REPO="openclaw/sqlrustgo" \
            -e BRANCH="rc/v3.4.0" \
            -e GATE="rc" \
            -e GITEA_URL="http://192.168.0.252:3000" \
            192.168.0.252:5000/sqlrustgo-gate:v5

  rc-gate-full:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout & Run Full Suite
        run: |
          docker run --rm \
            -e REPO="openclaw/sqlrustgo" \
            -e BRANCH="rc/v3.4.0" \
            -e GATE="full" \
            -e GITEA_URL="http://192.168.0.252:3000" \
            192.168.0.252:5000/sqlrustgo-gate:v5
