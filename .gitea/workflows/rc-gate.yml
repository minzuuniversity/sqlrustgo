name: RC Gate Pipeline
run-name: R-Gate v3.4.0

on:
  push:
    branches:
      - rc/v3.4.0
    tags:
      - v*-rc*
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rc-gate:
    runs-on: [gate-v3.4.0]
    steps:
      - name: Checkout
        run: |
          REPO_URL="http://192.168.0.252:3000/openclaw/sqlrustgo.git"
          git clone --depth=1 -b "rc/v3.4.0" "$REPO_URL" repo
          cd repo
          git fetch --depth=1 origin refs/pull/${{ gitea.pull_request.number }}/head 2>/dev/null || true
          git checkout "${{ gitea.sha }}"
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          echo "PATH=$PATH" && cargo --version && rustc --version
      - name: RC Gate
        run: |
          source "$HOME/.cargo/env"
          cd repo
          GITEA_URL="http://192.168.0.252:3000" BRANCH="rc/v3.4.0" \
            bash scripts/gate/check_rc_v340.sh 2>&1

  rc-gate-full:
    runs-on: [gate-v3.4.0]
    steps:
      - name: Checkout
        run: |
          REPO_URL="http://192.168.0.252:3000/openclaw/sqlrustgo.git"
          git clone --depth=1 -b "rc/v3.4.0" "$REPO_URL" repo
          cd repo
          git checkout "${{ gitea.sha }}"
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
      - name: RC Gate Full
        run: |
          source "$HOME/.cargo/env"
          cd repo
          GITEA_URL="http://192.168.0.252:3000" BRANCH="rc/v3.4.0" \
            bash scripts/gate/check_rc_v340.sh 2>&1
