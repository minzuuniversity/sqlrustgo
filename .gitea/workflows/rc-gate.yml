name: RC Gate Pipeline
run-name: R-Gate v3.4.0

on:
  push:
    branches:
      - rc/v3.4.0
    tags:
      - v*-rc*
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rc-gate:
    runs-on: [hp-z6g4, hp-z6g4, hp-z6g4, hp-z6g4]
    parallel: true
    steps:
      - name: Checkout
        run: |
          REPO_URL="http://192.168.0.252:3000/openclaw/sqlrustgo.git"
          git clone --depth=1 -b "rc/v3.4.0" "$REPO_URL" repo
          cd repo
          git checkout "${{ gitea.sha }}"

      - name: RC Gate (via gate container)
        run: |
          docker run --rm \
            -v "$(pwd):/repo" \
            -w /repo \
            -e BRANCH="rc/v3.4.0" \
            -e GATE="rc" \
            -e GITEA_URL="http://192.168.0.252:3000" \
            192.168.0.252:5000/sqlrustgo-gate:v5

  rc-gate-full:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        run: |
          REPO_URL="http://192.168.0.252:3000/openclaw/sqlrustgo.git"
          git clone --depth=1 -b "rc/v3.4.0" "$REPO_URL" repo
          cd repo
          git checkout "${{ gitea.sha }}"

      - name: Full suite (gate container)
        run: |
          docker run --rm \
            -v "$(pwd):/repo" \
            -w /repo \
            -e BRANCH="rc/v3.4.0" \
            -e GATE="full" \
            -e GITEA_URL="http://192.168.0.252:3000" \
            192.168.0.252:5000/sqlrustgo-gate:v5
