name: RC Gate Pipeline
run-name: R-Gate v3.4.0

on:
  push:
    branches:
      - rc/v3.4.0
    tags:
      - v*-rc*
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rc-gate:
    runs-on: [hp-z6g4, hp-z6g4, hp-z6g4, hp-z6g4]
    parallel: true
    steps:
      - name: Checkout
        run: |
          REPO_URL="http://192.168.0.252:3000/openclaw/sqlrustgo.git"
          git clone --depth=1 -b "${{ gitea.ref_name }}" "$REPO_URL" repo
          cd repo
          git checkout "${{ gitea.sha }}"

      - name: RC Gate
        run: |
          cd repo
          bash scripts/gate/check_rc_v340.sh

  rc-gate-full:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        run: |
          REPO_URL="http://192.168.0.252:3000/openclaw/sqlrustgo.git"
          git clone --depth=1 -b "${{ gitea.ref_name }}" "$REPO_URL" repo
          cd repo
          git checkout "${{ gitea.sha }}"

      - name: TPC-H Full
        run: |
          cd repo
          bash scripts/gate/check_tpch.sh --scale 1

      - name: Sysbench
        run: |
          cd repo
          bash scripts/gate/check_sysbench.sh

      - name: E2E Tests
        run: |
          cd repo
          bash scripts/test/e2e/run_e2e.sh
