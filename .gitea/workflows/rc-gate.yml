name: RC Gate Pipeline
run-name: R-Gate v3.4.0

on:
  push:
    branches:
      - rc/v3.4.0
    tags:
      - v*-rc*
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rc-gate:
    runs-on: [hp-z6g4, hp-z6g4, hp-z6g4, hp-z6g4]
    parallel: true
    steps:
      - name: Checkout
        run: |
          REPO_URL="http://192.168.0.252:3000/openclaw/sqlrustgo.git"
          git clone --depth=1 -b "rc/v3.4.0" "$REPO_URL" repo
          cd repo
          git checkout "${{ gitea.sha }}"

      - name: Checkout & Run RC Gate
        run: |
          wget -q -O /tmp/check_rc_v340.sh \
            "http://192.168.0.252:3000/openclaw/sqlrustgo/raw/rc/v3.4.0/scripts/gate/check_rc_v340.sh"
          chmod +x /tmp/check_rc_v340.sh
          bash /tmp/check_rc_v340.sh 2>&1

  rc-gate-full:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        run: |
          REPO_URL="http://192.168.0.252:3000/openclaw/sqlrustgo.git"
          git clone --depth=1 -b "rc/v3.4.0" "$REPO_URL" repo
          cd repo
          git checkout "${{ gitea.sha }}"

      - name: Checkout & Run Full Suite
        run: |
          wget -q -O /tmp/check_rc_v340.sh \
            "http://192.168.0.252:3000/openclaw/sqlrustgo/raw/rc/v3.4.0/scripts/gate/check_rc_v340.sh"
          chmod +x /tmp/check_rc_v340.sh
          bash /tmp/check_rc_v340.sh 2>&1
