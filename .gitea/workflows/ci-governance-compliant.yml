## 1. Workflow Trigger

### 1.1 Branch Filter

```yaml
on:
  push:
    branches:
      - develop/v2.8.0
      - develop/v3.7.0
      - develop/v3.8.0
      - beta/v2.8.0
      - beta/v3.8.0
  pull_request:
    branches:
      - develop/v2.8.0
