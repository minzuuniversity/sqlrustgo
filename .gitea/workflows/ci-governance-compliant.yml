## 2. Jobs

### 2.1 lint-build

```yaml
lint-build:
  runs-on: [hp-z6g4]
  steps:
    - name: Checkout
      run: |
        REPO="openclaw/sqlrustgo"
        git clone --depth=1 "http://192.168.0.252:3000/$REPO" repo
        cd repo
        git fetch --depth=1 origin "$GITEA_SHA"
        git checkout "$GITEA_SHA"

    - name: Clippy
      run: |
        cd repo
        cargo clippy --all-features -- -D warnings 2>&1 | tee clippy.log
        echo "clippy_sha256=$(sha256sum clippy.log | cut -d' ' -f1)" >> $GITHUB_OUTPUT

    - name: Format check
      run: |
        cd repo
        cargo fmt --check --all 2>&1 | tee fmt.log
        echo "fmt_sha256=$(sha256sum fmt.log | cut -d' ' -f1)" >> $GITHUB_OUTPUT

    - name: Build
      run: |
        cd repo
        cargo build --all-features 2>&1 | tee build.log
        echo "build_sha256=$(sha256sum build.log | cut -d' ' -f1)" >> $GITHUB_OUTPUT
```

### 2.2 test

```yaml
test:
  runs-on: [hp-z6g4]
  needs: [lint-build]
  steps:
    - name: Checkout
      run: |
        REPO="openclaw/sqlrustgo"
        git clone --depth=1 "http://192.168.0.252:3000/$REPO" repo
        cd repo
        git fetch --depth=1 origin "$GITEA_SHA"
        git checkout "$GITEA_SHA"

    - name: Build
      run: |
        cd repo
        cargo build --all-features 2>&1 | tee build.log

    - name: Run tests
      run: |
        cd repo
        cargo test --all-features 2>&1 | tee test_report.log
        echo "test_sha256=$(sha256sum test_report.log | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        echo "test_exit_code=$?" >> $GITHUB_OUTPUT

    - name: Test summary
      if: always()
      run: |
        cd repo
        PASS=$(grep -c 'test result: ok' test_report.log 2>/dev/null || echo "0")
        FAIL=$(grep -c 'test result: FAILED' test_report.log 2>/dev/null || echo "0")
        echo "Tests: passed=$PASS failed=$FAIL"
        echo "summary_pass=$PASS" >> $GITHUB_OUTPUT
        echo "summary_fail=$FAIL" >> $GITHUB_OUTPUT
        if [ "$FAIL" -gt 0 ]; then exit 1; fi
```

### 2.3 postcheck (Gate + Evidence + Observation)

```yaml
postcheck:
  runs-on: [hp-z6g4]
  needs: [test]
  steps:
    - name: Checkout
      run: |
        REPO="openclaw/sqlrustgo"
        git clone --depth=1 "http://192.168.0.252:3000/$REPO" repo
        cd repo
        git fetch --depth=1 origin "$GITEA_SHA"
        git checkout "$GITEA_SHA"

    - name: Verify Runner Online
      id: runner_check
      run: |
        cd repo
        # OBS-001: Verify runner status
        curl -s "http://192.168.0.252:3000/api/v1/repos/openclaw/sqlrustgo/actions/runners" > runners.json
        echo "runner_api_sha256=$(sha256sum runners.json | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        RUNNER_COUNT=$(python3 -c "import json; print(len(json.load(open('runners.json'))))" 2>/dev/null || echo "-1")
        echo "runner_count=$RUNNER_COUNT" >> $GITHUB_OUTPUT
        if [ "$RUNNER_COUNT" = "0" ] || [ "$RUNNER_COUNT" = "-1" ]; then
          echo "⚠️ Runner status: UNVERIFIED (API returned empty or error)" | tee runner_status.log
          echo "⚠️ Claim CLAIM-007 (Runner Online) → UNVERIFIED" >> runner_status.log
        else
          echo "✅ Runner status: verified (count=$RUNNER_COUNT)" | tee runner_status.log
        fi
        echo "runner_status_sha256=$(sha256sum runner_status.log | cut -d' ' -f1)" >> $GITHUB_OUTPUT

    - name: Run Gate (gate.sh — primary entrypoint)
      run: |
        cd repo
        chmod +x gate/gate.sh
        bash gate/gate.sh "${version:-v3.8.0}" 2>&1 | tee gate_report.log
        echo "gate_sha256=$(sha256sum gate_report.log | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        echo "gate_exit_code=$?" >> $GITHUB_OUTPUT

    - name: Run Coverage Check
      run: |
        cd repo
        bash scripts/gate/check_coverage.sh 2>&1 | tee coverage_report.log
        echo "coverage_sha256=$(sha256sum coverage_report.log | cut -d' ' -f1)" >> $GITHUB_OUTPUT

    - name: Run Evidence Binding Check
      run: |
        cd repo
        mkdir -p gate/evidence_binding_out
        bash scripts/gate/check_evidence_binding.sh "${version:-v3.8.0}" "gate/evidence_binding_out/" 2>&1 | tee evidence_binding.log
        echo "evidence_binding_sha256=$(sha256sum evidence_binding.log | cut -d' ' -f1)" >> $GITHUB_OUTPUT

    - name: Gate Summary
      if: always()
      run: |
        cd repo
        GATE_FAIL=$(grep -c '\[FAIL\]' gate_report.log 2>/dev/null || echo "0")
        COVERAGE_FAIL=$(grep -c 'FAIL\|failed' coverage_report.log 2>/dev/null || echo "0")
        EVIDENCE_FAIL=$(grep -c 'FAIL\|failed\|error' evidence_binding.log 2>/dev/null || echo "0")
        RUNNER_UNVERIFIED=$(grep -c 'UNVERIFIED' runner_status.log 2>/dev/null || echo "0")
        
        echo "Gate: failed=$GATE_FAIL coverage=$COVERAGE_FAIL evidence=$EVIDENCE_FAIL"
        echo "Runner verified: $((1 - RUNNER_UNVERIFIED))"
        echo ""
        echo "=== CI Run Observation Record ==="
        echo "run_id: $GITEA_RUN_ID"
        echo "commit: $GITEA_SHA"
        echo "branch: $GITEA_REF_NAME"
        echo "runner_count: $RUNNER_COUNT (API response sha256: $runner_api_sha256)"
        echo "gate_exit: $gate_exit_code (log sha256: $gate_sha256)"
        echo "test_summary: pass=$summary_pass fail=$summary_fail (log sha256: $test_sha256)"
        
        if [ "$GATE_FAIL" -gt 0 ] || [ "$COVERAGE_FAIL" -gt 0 ]; then
          echo "L1 gate failed"
          exit 1
        fi
        
        if [ "$RUNNER_UNVERIFIED" -gt 0 ]; then
          echo "⚠️ Runner not verified — CLAIM-007 remains UNVERIFIED"
        fi
        
        echo "All postcheck gates passed"
```

