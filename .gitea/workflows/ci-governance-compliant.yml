## 6. Multi-Remote Sync (Post-Commit)

```yaml
post-commit:
  runs-on: [self-hosted]
  steps:
    - name: Sync to all remotes
      run: |
        git push origin $GITEA_REF
        git push gitea $GITEA_REF || echo "⚠️ Gitea push failed (auth issue)"
        git push gitee $GITEA_REF || echo "⚠️ Gitee push failed (auth issue)"
        git push github $GITEA_REF || echo "⚠️ GitHub push failed (no remote)"
```

