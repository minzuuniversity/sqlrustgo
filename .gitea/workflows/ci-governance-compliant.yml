## 5. G-06 Freshness in CI

### 5.1 Freshness Check Job

```yaml
freshness-check:
  runs-on: [hp-z6g4]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  steps:
    - name: Checkout
      run: |
        cd repo
        git fetch origin
        
    - name: Check stale claims
      run: |
        cd repo
        python3 scripts/gate/check_freshness.py 2>&1 | tee freshness.log
        # Lists claims older than 30 days
        # Automatically degrades to stale
        # Reports to governance channel
```

### 5.2 Freshness Enforcement

- `verified` claims without fresh evidence → `stale`
- `stale` claims → governance review triggered
- `stale` claims on release-critical items → release blocked

