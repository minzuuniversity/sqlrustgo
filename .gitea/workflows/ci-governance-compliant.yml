## 4. Observation Record Format (G-07 Compliant)

Every CI run MUST produce an observation record:

```yaml
ci_observation:
  observation_id: OBS-CI-<run_id>
  timestamp: <ISO timestamp>
  run_id: <CI run ID>
  commit_sha: <commit>
  branch: <branch name>
  runner:
    type: gitea_actions
    runner_id: <runner ID if available>
    online_status: verified | unverified
    evidence:
      command: "curl .../actions/runners"
      stdout_sha256: <sha256>
      runner_count: <integer>
  gate:
    entrypoint: gate/gate.sh
    exit_code: <integer>
    log_sha256: <sha256>
    failed_checks: <count>
  test:
    pass_count: <integer>
    fail_count: <integer>
    log_sha256: <sha256>
  evidence_binding:
    log_sha256: <sha256>
    violations: <count>
  claim_bindings:
    - claim_id: CLAIM-001
      status: verified
      evidence: commit object exists
    - claim_id: CLAIM-007
      status: unverified
      evidence: runner API returned empty
```

