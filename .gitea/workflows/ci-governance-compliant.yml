# CI/CD Template — Governance-Compliant Workflow

> **Version**: v1.1 (Governance-Compliant)
> **Supersedes**: v1.0 (Legacy Plain)
> **Standard**: G-01 through G-07, GOVERNANCE_FRAMEWORK.md
> **Last Updated**: 2026-05-30

---

## 0. Design Principles

### 0.1 Evidence-First CI

Every CI run MUST produce:
1. **Artifact** — build/test outputs stored and referenced
2. **Observation Record** — raw command output with sha256
3. **Claim Binding** — test results linked to specific commit

### 0.2 No Claim Without Observation

```
❌ Forbidden in CI reports:
   "CI passed" (no evidence)
   "Tests OK"  (no observation)

✅ Required in CI reports:
   - Run ID
   - Command executed (exact)
   - stdout sha256
   - exit code
   - timestamp
```

### 0.3 L2 CI Gate Definition

L2 CI Gate is `supported` — the configuration exists.

L2 CI Gate is NOT `verified` until:
- ≥ 1 successful run recorded
- Runner status confirmed
- Job log captured

