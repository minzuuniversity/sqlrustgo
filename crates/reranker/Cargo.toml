[package]
name = "sqlrustgo-reranker"
version = "0.1.0"
edition = "2021"
description = "Reranker integration for SQLRustGo - BGE-Reranker-v2-m3 cross-encoder"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"

[dev-dependencies]
tokio-test = "0.4"
