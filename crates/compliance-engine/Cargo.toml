[package]
name = "sqlrustgo-compliance-engine"
version = "0.1.0"
edition = "2021"
description = "Compliance-as-Code Engine for SQLRustGo GMP"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["rt", "time"] }
async-trait = "0.1"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"
tokio = { version = "1.0", features = ["rt", "macros"] }
