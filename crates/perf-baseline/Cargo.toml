[package]
name = "sqlrustgo-perf-baseline"
version = "0.1.0"
edition = "2021"
description = "Performance baseline and governance for SQLRustGo"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
dirs = "6.0"

[dev-dependencies]
tempfile = "3.14"
