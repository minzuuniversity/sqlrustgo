[package]
name = "sqlrustgo-gmp-retrieval"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GMP retrieval v2 with BM25 and RRF fusion for SQLRustGo"

[dependencies]
sqlrustgo-types = { path = "../types" }
sqlrustgo-storage = { path = "../storage" }
sqlrustgo-parser = { path = "../parser" }
sqlrustgo-planner = { path = "../planner" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
lru = "0.12"
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[dev-dependencies]
tempfile.workspace = true
