[package]
name = "sqlrustgo-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sqlrustgo-catalog.workspace = true
sqlrustgo-storage.workspace = true
sqlrustgo-types.workspace = true
anyhow.workspace = true
rand = "0.8"
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
# #5525: the logical backup payload is checksummed with SHA-256. The old
# `md5_simple` helper is a 32-bit non-cryptographic rolling hash — it
# cannot detect corruption, so it must not be the integrity check for a
# backup that a restore is going to trust.
sha2.workspace = true
parking_lot.workspace = true
structopt = "0.3"
regex = "1.0"
flate2 = "1.0"
clap = { version = "4", features = ["derive"] }
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "tbl2bin"
path = "src/bin/tbl2bin.rs"

[[bin]]
name = "bench_client"
path = "src/bin/bench_client.rs"

[[bin]]
name = "physical-backup"
path = "src/bin/physical_backup.rs"

[[bin]]
name = "repro_4564"
path = "src/bin/repro_4564.rs"

[[bin]]
name = "ha"
path = "src/bin/ha.rs"

[[bin]]
name = "log-rotation"
path = "src/bin/log_rotation.rs"
