[workspace]
resolver = "2"
members = [
    "crates/gmp-core",
    "crates/gmp-storage",
    "crates/gmp-retrieval",
    "crates/gmp-reranker",
    "crates/gmp-llm",
    "crates/gmp-cli",
    "crates/gmp-server",
    "crates/gmp-eval",
    "crates/gmp-api",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["GMP Team"]
license = "MIT"
repository = "http://192.168.0.252:3000/openclaw/GMP-Platform"
rust-version = "1.80"

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for Ollama)
reqwest = { version = "0.12", features = ["json"] }

# Embeddings / Reranker (Ollama)
ollama-rs = "0.2"

# REST API
actix-web = "4"
actix-rt = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
