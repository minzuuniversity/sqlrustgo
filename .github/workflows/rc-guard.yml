# ARCHIVE-ONLY — 仅存档、不执行
# Gitea Actions 只读 .gitea/workflows/，本文件在这套 CI 上永不运行。
# 保留理由：v3.x 之前 GitHub 镜像的历史配置。把本文件当作「CI 已覆盖」的证据无效。
# 机器核对：docs/releases/v4.1.0/CI_EXECUTION_ROOTS.jsonl + audit/v4.1.0/probe_ci_roots.py
name: RC Guard

on:
  pull_request:
    branches:
      - rc

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        run: |
          SOURCE_BRANCH=${{ github.head_ref }}
          if [[ "$SOURCE_BRANCH" == feature/* ]]; then
            echo "❌ Cannot merge feature into rc"
            exit 1
          fi
          if [[ "$SOURCE_BRANCH" == experiment/* ]]; then
            echo "❌ Cannot merge experiment into rc"
            exit 1
          fi
          echo "✅ Source branch is allowed"