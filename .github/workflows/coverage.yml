# ARCHIVE-ONLY — 仅存档、不执行
# Gitea Actions 只读 .gitea/workflows/，本文件在这套 CI 上永不运行。
# 保留理由：v3.x 之前 GitHub 镜像的历史配置。把本文件当作「CI 已覆盖」的证据无效。
# 机器核对：docs/releases/v4.1.0/CI_EXECUTION_ROOTS.jsonl + audit/v4.1.0/probe_ci_roots.py
name: Coverage

on:
  push:
    branches: [develop/v2.6.0, main]
  pull_request:
    branches: [develop/v2.6.0]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --all-features --json --output-path artifacts/coverage.json

      - name: Upload coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: artifacts/coverage.json
