# ARCHIVE-ONLY — 仅存档、不执行
# Gitea Actions 只读 .gitea/workflows/，本文件在这套 CI 上永不运行。
# 保留理由：v3.x 之前 GitHub 镜像的历史配置。把本文件当作「CI 已覆盖」的证据无效。
# 机器核对：docs/releases/v4.1.0/CI_EXECUTION_ROOTS.jsonl + audit/v4.1.0/probe_ci_roots.py
name: SQL-92 Compliance Test Suite

on:
  push:
    branches: [main, develop/v*]
  pull_request:
    branches: [main, develop/v*]

jobs:
  sql92-compliance:
    name: SQL-92 Compliance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Build SQLRustGo
        run: cargo build --all-features --workspace

      - name: Run SQL-92 Compliance Tests
        run: |
          cd test/sql92
          cargo run -- --cases-dir cases --verbose

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql92-compliance-report
          path: test/sql92/sql92-compliance-report.md
          retention-days: 30

      - name: Show test summary
        run: |
          echo "## SQL-92 Compliance Test Results" >> $GITHUB_STEP_SUMMARY
          cat test/sql92/sql92-compliance-report.md >> $GITHUB_STEP_SUMMARY
