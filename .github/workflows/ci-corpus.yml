# ARCHIVE-ONLY — 仅存档、不执行
# Gitea Actions 只读 .gitea/workflows/，本文件在这套 CI 上永不运行。
# 保留理由：v3.x 之前 GitHub 镜像的历史配置。把本文件当作「CI 已覆盖」的证据无效。
# 机器核对：docs/releases/v4.1.0/CI_EXECUTION_ROOTS.jsonl + audit/v4.1.0/probe_ci_roots.py
name: CI Corpus Gate

on:
  pull_request:
    branches:
      - develop/v3.12.0
      - develop/v3.13.0
      - main
  push:
    branches:
      - develop/v3.12.0
      - develop/v3.13.0
      - main

permissions:
  contents: read

jobs:
  corpus:
    name: G18 SQL Corpus 80% gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
              ~/.cargo/registry
              ~/.cargo/git
              target
          key: ${{ runner.os }}-corpus-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
              ${{ runner.os }}-corpus-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run G18 corpus gate
        run: bash scripts/gate/check_sql_corpus_gate.sh
