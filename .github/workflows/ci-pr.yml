# ARCHIVE-ONLY — 仅存档、不执行
# Gitea Actions 只读 .gitea/workflows/，本文件在这套 CI 上永不运行。
# 保留理由：v3.x 之前 GitHub 镜像的历史配置。把本文件当作「CI 已覆盖」的证据无效。
# 机器核对：docs/releases/v4.1.0/CI_EXECUTION_ROOTS.jsonl + audit/v4.1.0/probe_ci_roots.py
name: CI (Optimized)

on:
  pull_request:
    branches:
      - develop/v2.8.0
      - develop/v2.7.0
      - develop/v3.9.0
      - develop/v3.10.0
      - develop/v3.11.0
      - develop/v3.12.0
      - develop/v4.0.0
      - develop/v4.1.0
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.env*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------
  # Pre-check jobs (run in parallel)
  # ----------------------------------------
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
          cache-targets: false

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # #5113: no `continue-on-error` on a Hard Gate step — it made doc
      # breakage invisible. Verified exit 0 on this tree before removing it.
      - name: Check docs build
        run: cargo doc --no-deps --all-features

  # ----------------------------------------
  # Build job
  # ----------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build"
          cache-targets: false

      - name: Build
        run: cargo build --all-features

  # ----------------------------------------
  # Test jobs (run in parallel after build)
  # ----------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
          cache-targets: false

      - name: Run unit tests
        run: cargo test --workspace --lib

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-integration"
          cache-targets: false

      - name: Run integration tests
        run: cargo test --workspace --features v313_3_profile --test '*'

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Gate G17 — Coverage
        run: SQLRUSTGO_COVERAGE_STAGE=ga bash scripts/gate/check_coverage_v312.sh

  # ----------------------------------------
  # Coverage gate
  # ----------------------------------------
  coverage:
    name: Gate G17 — Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Gate G17 — Coverage
        # #5581: the threshold is the SSOT's per-stage bar, and the stage is
        # stated explicitly. `ga` = COVERAGE_MIN_GA (85) — the same criterion
        # the Gitea CI judges (.gitea/workflows/ci.yml → "Gate L1 — Coverage"
        # → SQLRUSTGO_COVERAGE_STAGE=ga), so the two CIs no longer apply
        # different numbers to the same quantity.
        run: SQLRUSTGO_COVERAGE_STAGE=ga bash scripts/gate/check_coverage_v312.sh

  # ----------------------------------------
  # SOAK detach regression (#4595, Tier-1)
  # ----------------------------------------
  # 防止 P-1 修复 (setsid+nohup+detach 块) 被 refactor/误删后静默回归。
  # 静态检查 (< 1s): 关键模式 + trap + guard 存在
  # Tier-1 检查: P-2/P-3/P-4/P-9 env override + QPS 解析
  # 行为测试 (SIGKILL 父进程后子进程存活) 仅在 nightly / --behavioral 启用,PR CI 只跑静态。
  soak-detach-regression:
    name: SOAK Detach Regression (#4595)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: SOAK self-detach 静态检查 (P-1 回归门禁)
        run: bash scripts/soak/test_run_soak_loop_detach.sh

      - name: SOAK Tier-1 env override + QPS 解析 (P-2/P-3/P-4/P-9)
        run: bash scripts/soak/test_run_soak_loop_tier1.sh

      - name: SOAK Tier-2 workload sweep + JSON reports + disk-restart boundary (P-6/P-10/P-5)
        run: bash scripts/soak/test_run_soak_loop_tier2.sh

      - name: SOAK chaos drills 结构检查 (#4597)
        run: bash scripts/soak/test_chaos_drills.sh

  # ----------------------------------------
  # Security audit
  # ----------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # #5113: this job is a Hard Gate, so it must be able to fail. It
      # previously ran `cargo audit || true`, which reported success while
      # vulnerabilities were present — the gate could never go red.
      #
      # Known unpatched advisories are listed in `.cargo/audit.toml` rather
      # than swallowed here: adding an entry there is a deliberate act, and
      # the entry carries the reason and a re-check condition.
      - name: Run security audit
        run: cargo audit

  # ----------------------------------------
  # Verification gate
  # ----------------------------------------
  verify:
    name: Anti-Cheat Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Anti-Cheat gate has to compare the PR against the branch it
      # actually targets. Two defects made that impossible:
      #   * the base was hardcoded to `origin/main`, so a PR aimed at
      #     develop/v4.x was diffed against an unrelated trunk;
      #   * the checkout was shallow (fetch-depth: 1), so the three-dot
      #     diff had no merge base and failed with
      #     "fatal: origin/main...HEAD: no merge base".
      # fetch-depth: 0 gives the full history, and the base ref comes
      # from the event payload instead of a constant.
      - name: Resolve base ref
        id: base
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="main"
          fi
          git fetch --no-tags --force origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Anti-Cheat base ref: ${BASE_REF}"

      # -----------------------------
      # 1. 防测试篡改
      # -----------------------------
      - name: Detect test file changes
        run: |
          CHANGED=$(git diff --name-only "origin/${{ steps.base.outputs.base_ref }}...HEAD" | grep "^tests/" || true)
          if [ ! -z "$CHANGED" ]; then
            echo "❌ Tests modified:"
            echo "$CHANGED"
            exit 1
          fi

      # -----------------------------
      # 2. 禁止新增 #[ignore]
      # -----------------------------
      - name: Detect NEW #[ignore] additions
        run: |
          # The old pattern was `\+.*#\[ignore\]`, which only matches the
          # bare `#[ignore]` form. This repository mostly uses the
          # attributed form `#[ignore = "reason"]` (83 occurrences vs 101
          # bare ones), so the gate silently missed the majority of the
          # additions it was written to catch.
          NEW_IGNORES=$(git diff "origin/${{ steps.base.outputs.base_ref }}...HEAD" -- "*.rs" | grep -E '^\+.*#\[ignore([[:space:]]*\]|[[:space:]]*=|\()' || true)
          if [ ! -z "$NEW_IGNORES" ]; then
            echo "❌ NEW #[ignore] detected in PR:"
            echo "$NEW_IGNORES"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate verification report
        run: |
          python3 scripts/verification_engine.py || true

      - name: Validate proof
        run: |
          if [ -f verification_report.json ]; then
            cat verification_report.json
            BASELINE=$(jq -r '.baseline_verified' verification_report.json)
            BLOCKERS=$(jq -r '.blocker_count' verification_report.json)

            if [ "$BASELINE" != "true" ]; then
              echo "❌ baseline_verified != true"
              exit 1
            fi

            if [ "$BLOCKERS" != "0" ]; then
              echo "❌ blockers exist"
              exit 1
            fi

            echo "✅ Proof verified"
          else
            # #5113: a missing report must not be a pass. The previous
            # "⚠️ ... skipping" path let the gate go green with no evidence
            # at all — the script's non-zero exit was swallowed above and
            # the report's absence was treated as success.
            echo "❌ verification_report.json not found — the Anti-Cheat gate has no evidence to judge"
            exit 1
          fi

      - name: Prevent proof tampering
        run: |
          if git diff --name-only "origin/${{ steps.base.outputs.base_ref }}...HEAD" | grep "verification_report.json"; then
            echo "❌ Proof file modified in PR"
            exit 1
          fi
