  - id: "P0-08 WAL 恢复的二次项（去重扫描逐条整表扫描）"
    was: "实测重启后首条全表查询 24min22s（紧接同一条 0.08s），68,288 行 / 58,288 条 INSERT / 8.0MB WAL。原报告归因：save_table_full 被逐条调用、delta 追加路径一次未走到。"
    resolved: "2026-10-23 实测并实施修复。① 原报告的归因被更正：写入路径一直走 delta 追加分支（基线快照 t.json 停在 650 B 的 schema，增量日志 t.delta 承载全部行），且其每行成本是常数（500/2000/8000 行 = 96.4/85.8/86.4 µs/行）—— save_table_full 并未被逐条调用。② 真正的二次项是去重扫描：apply_wal_entry 对每条被重放的 Insert 都要全表扫描 + 全表克隆一次来判断该行是否已存在，每行成本随表规模增长（63.9 → 247.9 → 896.4 µs/行，行数 x16 ⇒ 每行成本 x14）。③ 修法：新增 RecoveryRowIndex（crates/storage/src/recovery_engine.rs），每表扫一次建索引、之后每条 Insert 的去重判定为 O(1) 哈希查找；重放自己写入的行也进索引；Update/Delete 会改变表持有的行而 WAL entry 不带旧行内容 ⇒ 这两类 entry 作废受影响表的索引（重建 = 一次扫描）。④ 实测（真实 RecoveryEngine::recover()）：每行成本 210.3 → 224.0 → 372.4 µs（500/2000/8000 行），行数 x16 只带来每行成本 x1.8；外推到 58,288 行：修复前按二次外推 ≈ 461 s，修复后 ≈ 21.7 s，约 21 倍。⑤ 语义正确性 5/5 PASS（crates/storage/tests/wal_recovery_dedup_p0_08.rs），钉住表里已有/同次重放重复/先 Update 过/先 Delete 过/互不相同五种情形，后两种是陈旧索引会丢已提交数据的情形。⑥ 顺带修掉 crates/types/src/value.rs 的 Value::Hash 与 PartialEq 不一致（0.0 与 -0.0 相等却哈希不同，会让唯一约束判定/哈希连接/MVCC 键集漏判）。⑦ 回归：cargo test -p sqlrustgo-storage 97 个测试二进制全绿 / 1544 passed / 0 failed（跳过 6 个 fault-injection 用例，原因见 DEFECTS_AND_ISSUES.md P0-08 的注）；cargo test -p sqlrustgo-types 152 passed / 0 failed；cargo clippy --all-features --all-targets -- -D warnings（钉 1.95.0）0 error。⑧ 仍然没做的明确记录在案：恢复与 listener 的先后关系未变（结构性结论不变）、写入路径每行一次落盘仍是常数成本、Update/Delete 路径本批不扩大范围、历史 SOAK 从不中途重启属覆盖面问题。"
    evidence: "docs/releases/v4.1.0/evidence/WAL_RECOVERY_SCALE_P0_08_2026-10-23.md + docs/releases/v4.1.0/ISSUE-RECOVERY-QUADRATIC-REPLAY.md §9 + crates/storage/src/recovery_engine.rs + crates/storage/tests/wal_recovery_dedup_p0_08.rs"

