# 咨询专家席位注册表 (Expert Seat Registry) —— SSOT
#
# 权威关系（务必读）：
#   1. 本文件登记"有哪些席位、各自能干什么、怎么调用"。
#   2. 本文件里的 measured_* 字段是**某一次真实探测的快照**，不是当前事实。
#      当前事实由 `python3 scripts/gate/expert_ladder.py health` 现场探测产生，
#      证据由 audit/v4.1.0/audit_run.py 承载（runs/<run_id>/logs/，audit_run.py verify 核对）。
#      文档快照与现场探测冲突时，
#      **以现场探测为准**（AGENTS §1-2 Version Truth / AFP §4 UnverifiedDoc）。
#   3. 任何席位都**没有**门禁决策权威（AFP §5.1：AI 结论=Soft Gate）。
#
# lineage（血统）与 family（服务栈）的区别 —— R1 用 lineage，不是 family：
#   lineage = 模型血统/厂商：deepseek / qwen / gpt。**只有不同 lineage 的席位才算互相独立佐证。**
#   family  = 服务栈：qwen-strata(strata 服务) 与 qwen-llamacpp(llama.cpp) 是两个不同的
#             部署，但同一血统；它们互相"投票"等于同一系模型给自己背书（ADR-014 D-06），
#             因此 R1 只数 lineage。2026-11-04 的教训：一度把 qwen-strata 与
#             qwen-llamacpp 当成两个独立席位，导致"2 家族可用"的假充足。
#   同一 lineage 的不同规格（qwen 9B / 35B-A3B / flash-next）更不算独立席位。

schema_version: expert-seats/v1
updated: "2026-11-04"
updated_by: mcode-macmini

policy:
  required_lineages_for_adjudication: 2    # R1 血统独立（见下）
  fail_closed: true                          # 缺位/超时/不可解析 => INCOMPLETE
  soft_gate_only: true                       # 模型意见不得写成 PASS
  false_positive_needs_machine_evidence: true  # R3 误报必须由反向变异夹具判定
  single_session_serialization: true         # 本地端点用文件锁串行化

seats:
  - id: deepseek-chat
    family: deepseek
    lineage: deepseek
    endpoint: "http://127.0.0.1:9655/v1/chat/completions"
    model: deepseek-chat
    tier: 1
    roles: [triage, adjudicate, plan_review, arbitrate]
    max_tokens_default: 400
    timeout_s: 60
    single_session: true
    reasoning_effort: null
    enabled: true
    measured_at: "2026-11-04T15:40Z"
    measured_source_run: "mcode-macmini-probe-20261104T1540"
    measured_latency_s: 1.36
    measured_tps: 17.6
    calibration_min: 0.5
    measured_note: >
      曾经的首选裁定席位（1.36s / 17.6 tps）。2026-11-04 21:30 起不可用：
      上游直连 create_pow_challenge 返回 {"code":40003,"msg":"Authorization Failed
      (invalid token)"} ⇒ token 过期（不是上游改接口）。auth 文件 mtime=Oct 22，
      说明重新认证尚未落盘；login.sh 已修好浏览器探测，登录窗口待人工完成
      （手机验证码/二维码，Agent 不得代做）。恢复判据：health 里 ok=true 且标定通过。

  - id: flash-next-252
    family: qwen-strata
    lineage: qwen
    endpoint: "http://192.168.0.252:8001/v1/chat/completions"
    model: qwen3.8-flash-next-iq3_s
    tier: 2
    roles: [triage, adjudicate, long_context]
    max_tokens_default: 400
    timeout_s: 300
    measured_note_extra: >-
      2026-11-05 实测（**带主证据的长问题**才是真实负载，探针式 PONG 不代表）：简单问 23.2s / 35.3s / 58.9s / 85.96s / 90.98s；带主证据（3.8KB，8 条声称）**120.01s 超时弃权**。⇒ 原 timeout_s=120 是照着 2026-11-04 的 17.18s 探针定的，对带证据的问题不够；按 EX-6「提到明显高于 p99 延迟」调为 300。
    single_session: true
    reasoning_effort: "none"
    enabled: true
    measured_at: "2026-11-04T15:40Z"
    measured_source_run: "mcode-macmini-probe-20261104T1540"
    measured_latency_s: 17.18
    measured_tps: 7.8
    measured_note: >
      strata 服务，n_ctx=262144，无 api_key。带 reasoning_effort=none 时
      8 token 出答（12.1s，含排队）；不带时思考耗时长。作为第二家族席位。

  - id: local-qwen35-9b
    family: qwen-llamacpp
    lineage: qwen
    endpoint: "http://127.0.0.1:8002/v1/chat/completions"
    model: qwen35-9b-mac
    tier: 3
    roles: [triage, lint_hint, dedup_hint]
    max_tokens_default: 256
    timeout_s: 120
    single_session: true
    reasoning_effort: "none"
    enabled: true
    measured_at: "2026-11-05T01:20Z"
    measured_source_run: "20261105-tristate-001 (health 记录) / 直连 curl 复测"
    measured_latency_s: null      # 未出答：240s 超时
    measured_tps: null
    measured_drift: >
      配置漂移：本席位写的是 qwen35-9b-mac，但 8002 现在 /v1/models 报的是
      Swift-1.5-Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf（27B，不是 9B）。
      同一端点 /v1/models 立即应答，但 chat/completions 16 token 请求 240s 未返回
      （curl -m 240 空返回）=> 服务在但推理侧挂死/被占。属 owner/hermes 复核项，
      不是我能通过调参修好的（看板 IL-8）。
    measured_note: >
      思考型模型：不传 reasoning_effort=none 时 content 为空、全部落在
      reasoning_content 且 finish_reason=length（200 token 全用在思考上）。
      因此本席位**必须**带 reasoning_effort=none，否则等于弃权。
      延迟含排队，生成速度约 1-2 token/s，只适合廉价分诊，不适合批量裁定。

  - id: gmp35b-250
    family: qwen-llamacpp
    lineage: qwen
    endpoint: "http://192.168.0.250:8011/v1/chat/completions"
    model: gmp-agent-35b-a3b
    tier: 4
    roles: [triage, long_context]
    max_tokens_default: 512
    timeout_s: 240
    single_session: true
    reasoning_effort: "none"
    enabled: true
    measured_at: "2026-11-05T01:23Z"
    measured_source_run: "20261105-tristate-001 (health 记录) / 现场单席位 health"
    measured_latency_s: 37.7
    measured_tps: 12.81
    measured_note: >
      2026-11-05 复测：--max-tokens 1500 下 finish_reason=stop、483 completion token、
      37.7s、parseable_contract=true。上一轮把它判为不可用是**我的参数问题**
      （health 默认 max_tokens=256，thinking 把预算吃光 => content 空 + finish=length）。
      仍有的约束：roles 不含 adjudicate（只能分诊/长文，不能进裁定计数）；
      与 250 上的 omp 抢同一单会话服务，调用必须带文件锁，不得批量循环。

  - id: chatgpt-web
    family: gpt
    lineage: gpt
    endpoint: "http://127.0.0.1:9656/v1/chat/completions"
    model: web-session-chat
    tier: 1
    roles: [adjudicate, arbitrate, plan_review]
    max_tokens_default: 400
    timeout_s: 480
    measured_note_extra: >-
      2026-11-05 实测：简单问 33.9s / 39.2s / 64.8s / 75.1s；带主证据的长问 181.88s；最长一次**在 240s 上超时弃权**（门禁改动那个问）⇒ 按 p99 上调为 480。
    single_session: true          # 单账号串行，无 SLA
    reasoning_effort: null
    calibration_min: 0.5
    enabled: true
    measured_at: "2026-11-04T21:41+08:00"
    measured_source_run: "mcode-macmini-seat-check-20261104T2141"
    measured_latency_s: 40.05
    measured_tps: null            # 上游 usage 不回传 token 数，TPS 无法实测，不得估算
    measured_note: >
      2026-11-04 21:41 实测：返回 content="PONG"、finish_reason=stop、
      web_session.latency_ms=40051。此前"失效"的根因（omp 判别实验，同一出口 IP、
      独立临时 profile）：headless 默认 UA 带 HeadlessChrome/156 ⇒ Cloudflare 拦截页
      （标题「请稍候…」，body 空，可输入元素 0）；换成真实 Chrome UA +
      --disable-blink-features=AutomationControlled ⇒ 10 秒出正文。⇒ 出口未被封，是
      headless 指纹被封。cf_clearance 绑 UA+IP，故有头/无头必须同一 UA。
      调用方纪律：模型名只能是 web-session-chat / web-session-thinking；
      写 gpt-5.1 返回 400 invalid_model —— 那是调用方错误，不得据此判定席位缺席。

fallback_notes:
  - "2026-11-04：owner 明确指示『不要部署大模型，只检查能否使用』。因此曾把 gemma-4-E4B 拷到 250 并试起 8012（模型加载成功、health=200），随即按要求撤销：进程已停、4.98GB GGUF 已删除、250 恢复原状。本文件不得登记需要新部署模型的席位。"
  - "252 的 hermes 正在升级大模型服务（TPS、多会话、本地 deepseek v4）。升级后重跑 health 并更新本文件的 measured_* 快照。"
  - "禁止把席位凭据写入本文件；本地端点均无鉴权（strata api_key=false），桥接端点的上游凭据由 node 服务自持。"
